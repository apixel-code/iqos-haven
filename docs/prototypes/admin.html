      /* ---------- metrics ---------- */
      const inR = (o, a, b) => o.created >= a && o.created < b;
      function metrics(a, b, filter) {
        let os = ORD.filter((o) => inR(o, a, b));
        if (filter) os = os.filter(filter);
        const valid = os.filter((o) => o.status !== "cancelled");
        const rev = r2(valid.reduce((s, o) => s + o.total, 0));
        const by = {};
        STATUSES.forEach((s) => (by[s] = 0));
        os.forEach((o) => by[o.status]++);
        return {
          orders: os.length,
          valid: valid.length,
          rev,
          aov: valid.length ? r2(rev / valid.length) : 0,
          by,
          list: os,
        };
      }
      function pct(a, b) {
        if (!b) return a ? 100 : 0;
        return Math.round(((a - b) / b) * 1000) / 10;
      }
      function deltaHtml(cur, prev, invert, label = "vs previous") {
        const d = pct(cur, prev);
        const up = d > 0,
          flat = Math.abs(d) < 0.5;
        const good = invert ? !up : up;
        return `<span class="delta ${flat ? "flat" : good ? "up" : "down"}">${flat ? "" : ico(up ? "up" : "down")}${flat ? "No change" : (up ? "+" : "") + d.toFixed(1) + "%"}</span><span class="delta-c">${label}</span>`;
      }
      function buckets(a, b, gran) {
        const out = [];
        let t = new Date(a);
        if (gran === "hour") {
          t = new Date(a.getFullYear(), a.getMonth(), a.getDate(), 0);
          while (t < b) {
            out.push({
              a: new Date(t),
              b: new Date(t.getTime() + HR),
              l: tm(t).replace(":00", ""),
            });
            t = new Date(t.getTime() + HR);
          }
        } else if (gran === "day") {
          t = sod(a);
          while (t < b) {
            const n = addD(t, 1);
            out.push({ a: t, b: n, l: fDs(t) });
            t = n;
          }
        } else if (gran === "week") {
          t = sod(a);
          t = addD(t, -((t.getDay() + 6) % 7));
          while (t < b) {
            const n = addD(t, 7);
            out.push({ a: t, b: n, l: "w/c " + fDs(t) });
            t = n;
          }
        } else {
          t = new Date(a.getFullYear(), a.getMonth(), 1);
          while (t < b) {
            const n = new Date(t.getFullYear(), t.getMonth() + 1, 1);
            out.push({
              a: t,
              b: n,
              l: MON[t.getMonth()] + " " + String(t.getFullYear()).slice(2),
            });
            t = n;
          }
        }
        return out;
      }
      function series(a, b, gran, filter, field = "rev") {
        const bs = buckets(a, b, gran);
        return {
          labels: bs.map((x) => x.l),
          vals: bs.map((x) => {
            const m = metrics(x.a, x.b, filter);
            return field === "rev"
              ? m.rev
              : field === "orders"
                ? m.orders
                : field === "aov"
                  ? m.aov
                  : m.by.cancelled;
          }),
        };
      }
      function prodSales(a, b, filter) {
        const map = {};
        ORD.filter((o) => inR(o, a, b) && o.status !== "cancelled").forEach(
          (o) =>
            o.items.forEach((it) => {
              const p = byId[it.pid];
              if (filter && !filter(p)) return;
              map[it.pid] = map[it.pid] || { p, units: 0, rev: 0, orders: 0 };
              map[it.pid].units += it.qty;
              map[it.pid].rev += it.qty * it.price;
              map[it.pid].orders++;
            }),
        );
        return Object.values(map).sort((x, y) => y.rev - x.rev);
      }
      function brandSales(a, b) {
        const m = {};
        prodSales(a, b).forEach((x) => {
          const k = x.p.b;
          m[k] = m[k] || { b: B[k], units: 0, rev: 0 };
          m[k].units += x.units;
          m[k].rev += x.rev;
        });
        return Object.values(m).sort((x, y) => y.rev - x.rev);
      }

      /* ---------- charts ---------- */
      function chartBox(spec, h = 240) {
        const id = "ch" + ++chartSeq;
        CHS[id] = Object.assign({ h }, spec);
        return `<div class="chart" data-ch="${id}" style="height:${h}px" role="img" aria-label="${esc(spec.aria || "Chart")}"></div>`;
      }
      function niceMax(v) {
        if (v <= 0) return 1;
        const e = Math.pow(10, Math.floor(Math.log10(v)));
        const f = v / e;
        return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * e;
      }
      const fmtShort = (v) => {
        if (v >= 1000) {
          const k = v / 1000;
          return (Number.isInteger(k) ? k : k.toFixed(1)) + "K";
        }
        return String(Math.round(v * 10) / 10);
      };
      function drawCharts() {
        $$(".chart[data-ch]").forEach((el) => {
          const sp = CHS[el.dataset.ch];
          if (sp) drawChart(el, sp);
        });
      }
      function drawChart(el, sp) {
        const W = Math.max(260, el.clientWidth),
          H = sp.h,
          pl = sp.money ? 46 : 34,
          pr = 10,
          pt = 12,
          pb = 26;
        const n = sp.labels.length;
        const all = [...sp.vals, ...(sp.prev || [])];
        const raw = Math.max(...all, 1) * 1.05;
        const stp = sp.money
          ? niceMax(raw / 4)
          : Math.max(1, Math.ceil(niceMax(raw / 4)));
        const nt = Math.max(1, Math.ceil(raw / stp));
        const max = stp * nt;
        const iw = W - pl - pr,
          ih = H - pt - pb;
        const X = (i) =>
          sp.type === "bar"
            ? pl + ((i + 0.5) * iw) / n
            : pl + (n <= 1 ? iw / 2 : (i * iw) / (n - 1));
        const Y = (v) => pt + ih - (v / max) * ih;
        let g = "";
        for (let k = 0; k <= nt; k++) {
          const v = stp * k,
            y = Y(v);
          g += `<line class="${k ? "gl" : "base"}" x1="${pl}" x2="${W - pr}" y1="${y}" y2="${y}"/><text class="tk" x="${pl - 8}" y="${y + 4}" text-anchor="end">${fmtShort(v)}</text>`;
        }
        const step = Math.max(
          1,
          Math.ceil(n / Math.max(2, Math.floor(iw / 74))),
        );
        for (let i = 0; i < n; i += step) {
          g += `<text class="tk" x="${X(i)}" y="${H - 6}" text-anchor="middle">${esc(sp.labels[i])}</text>`;
        }
        let marks = "";
        if (sp.type === "bar") {
          const bw = Math.max(3, Math.min(28, iw / n - 4));
          sp.vals.forEach((v, i) => {
            const y = Y(v),
              h = Math.max(0, pt + ih - y);
            marks += `<path class="bar" data-i="${i}" d="M${X(i) - bw / 2},${pt + ih}V${y + Math.min(4, h)}q0,-4 4,-4h${bw - 8}q4,0 4,4V${pt + ih}Z"/>`;
          });
        } else {
          const pts = sp.vals.map((v, i) => [X(i), Y(v)]);
          if (sp.prev) {
            marks += `<path class="ln prev" d="M${sp.prev.map((v, i) => X(i) + "," + Y(v)).join("L")}"/>`;
          }
          marks += `<path class="ar" d="M${pts[0][0]},${pt + ih}L${pts.map((p) => p.join(",")).join("L")}L${pts[pts.length - 1][0]},${pt + ih}Z"/><path class="ln" d="M${pts.map((p) => p.join(",")).join("L")}"/>`;
          const l = pts[pts.length - 1];
          marks += `<circle class="pt" cx="${l[0]}" cy="${l[1]}" r="4"/>`;
        }
        el.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${g}${marks}<g class="hov"></g><rect x="${pl}" y="${pt}" width="${iw}" height="${ih}" fill="transparent"/></svg><div class="tip" hidden></div>`;
        const svg = el.querySelector("svg"),
          hov = el.querySelector(".hov"),
          tip = el.querySelector(".tip");
        const move = (e) => {
          const r = svg.getBoundingClientRect();
          const x = e.clientX - r.left;
          let i =
            sp.type === "bar"
              ? Math.floor(((x - pl) / iw) * n)
              : Math.round(((x - pl) / iw) * (n - 1));
          i = Math.max(0, Math.min(n - 1, i));
          const v = sp.vals[i];
          hov.innerHTML =
            sp.type === "bar"
              ? ""
              : `<line class="xh" x1="${X(i)}" x2="${X(i)}" y1="${pt}" y2="${pt + ih}"/>${sp.prev ? `<circle class="pt prev" cx="${X(i)}" cy="${Y(sp.prev[i])}" r="3.5"/>` : ""}<circle class="pt" cx="${X(i)}" cy="${Y(v)}" r="4.5"/>`;
          if (sp.type === "bar")
            $$(".bar", svg).forEach((b) =>
              b.classList.toggle("dim", +b.dataset.i !== i),
            );
          const f = (x) =>
            sp.money
              ? `AED ${money(x)}`
              : `${x.toLocaleString("en-US")}${sp.unit ? " " + sp.unit : ""}`;
          tip.innerHTML = `<span>${esc(sp.tipLabels ? sp.tipLabels[i] : sp.labels[i])}</span><b>${f(v)}</b>${sp.prev ? `<span>Previous: ${f(sp.prev[i])}</span>` : ""}`;
          tip.hidden = false;
          tip.style.left = Math.max(70, Math.min(W - 70, X(i))) + "px";
          tip.style.top = Math.max(40, Y(v)) + "px";
        };
        const leave = () => {
          hov.innerHTML = "";
          tip.hidden = true;
          $$(".bar", svg).forEach((b) => b.classList.remove("dim"));
        };
        svg.addEventListener("pointermove", move);
        svg.addEventListener("pointerleave", leave);
        svg.addEventListener("pointerdown", move);
      }
      function spark(vals) {
        const w = 72,
          h = 24,
          max = Math.max(...vals, 1),
          min = Math.min(...vals);
        const X = (i) => (i * (w - 4)) / (vals.length - 1) + 2,
          Y = (v) => h - 3 - ((v - min) / (max - min || 1)) * (h - 7);
        const d = vals
          .map((v, i) => X(i).toFixed(1) + "," + Y(v).toFixed(1))
          .join("L");
        return `<svg class="spark" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path class="a" d="M2,${h}L${d}L${w - 2},${h}Z"/><path class="l" d="M${d}"/><circle cx="${X(vals.length - 1)}" cy="${Y(vals[vals.length - 1])}" r="2.2"/></svg>`;
      }
      let rzT;
      new ResizeObserver(() => {
        clearTimeout(rzT);

      /* ---------- shared UI helpers ---------- */
      const stockTag = (p) => {

      };
      const pubTag = (p) =>

        `<span class="stars" aria-label="${n} out of 5 stars">${[1, 2, 3, 4, 5].map((i) => `<svg class="i ${i > n ? "off" : ""}" aria-hidden="true"><use href="#i-star"/></svg>`).join("")}</span>`;
      function emptyState(icon, title, text, actions = "") {
        return `<div class="empty"><div class="ic">${ico(icon, "lg")}</div><h3>${title}</h3><p>${text}</p>${actions ? `<div class="row">${actions}</div>` : ""}</div>`;
      }
      function pager(total, page, per, key) {
        const pages = Math.max(1, Math.ceil(total / per));
        const s = (page - 1) * per + 1,
          e = Math.min(total, page * per);
        let btns = [];
        const add = (p) =>
          btns.push(
            `<button data-a="page" data-k="${key}" data-p="${p}" ${p === page ? 'aria-current="page"' : ""}>${p}</button>`,
          );
        const show = new Set(
          [1, pages, page - 1, page, page + 1].filter(
            (p) => p >= 1 && p <= pages,
          ),
        );
        let last = 0;
        [...show]
          .sort((a, b) => a - b)
          .forEach((p) => {
            if (p - last > 1)
              btns.push(`<span class="muted" aria-hidden="true">…</span>`);
            add(p);
            last = p;
          });
        return `<div class="tbl-f"><span>${total ? `Showing ${s.toLocaleString()}–${e.toLocaleString()} of ${total.toLocaleString()}` : "No results"}</span><div class="pager"><button data-a="page" data-k="${key}" data-p="${page - 1}" ${page <= 1 ? "disabled" : ""} aria-label="Previous page">${ico("cl", "sm")}</button>${btns.join("")}<button data-a="page" data-k="${key}" data-p="${page + 1}" ${page >= pages ? "disabled" : ""} aria-label="Next page">${ico("cr", "sm")}</button></div></div>`;
      }
      ACT.page = (t) => {
        const k = t.dataset.k;

        const attn = [

            : "",
        ].join("");
        const kpis = own
          ? [
              {
                l: "Revenue",

              {

                sp: sp7("aov"),
                go: ["analytics", { tab: "sales" }],
              },
              {
                l: "Pending orders",
                v: pend.length,
                d: `<span class="delta-c">${del.length ? `<b style="color:var(--err)">${del.filter((o) => o.status === "pending").length} waiting over 2 h</b>` : "All recent"}</span>`,
                go: ["orders", { tab: "pending" }],
                live: true,
              },
            ]
          : [
              {
                l: "Today's orders",
                v: todayM.orders,
                d: deltaHtml(
                  todayM.orders,
                  yM.orders,
                  false,
                  "vs this time yesterday",

  </div>
  <div class="savebar"><span class="msg" id="savebar-msg" ${S.dirty ? "" : "hidden"}><span class="dotc"></span>Unsaved changes</span><button class="btn btn-s" data-a="go" data-r="products">Cancel</button>${E.isNew || E.status === "draft" ? `<button class="btn btn-s" data-a="peSave" data-m="draft">Save draft</button><button class="btn btn-p" data-a="peSave" data-m="publish" id="btn-publish">${ico("globe")}Publish</button>` : `<button class="btn btn-p" data-a="peSave" data-m="save" id="btn-publish">Save changes</button>`}</div>`;
      };
      ACT.jump = (t) => {
        const el = document.getElementById(t.dataset.t);
        if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
      };
      FORM.pe = (el) => {
        const E = S.ui.pe;
        const k = el.dataset.k;
        let v = el.value;
        if (k === "sku") v = v.toUpperCase();
        E[k] = v;
        if (k === "name" && !E.slugTouched) {
          E.slug = slugify(v);
          const s = $("#pe-slug");
          if (s) s.value = E.slug;
        }
        if (k === "slug") E.slugTouched = true;
        if (E.err[k]) {
          delete E.err[k];
          el.classList.remove("err");
          const m = el.closest(".field")?.querySelector(".errm");
          if (m) m.remove();
        }
        setDirty(E.isNew ? "this new product" : E.name);
        if (["stock", "th"].includes(k)) {
          const s = $("#pe-stockstate");
          if (s)
            s.innerHTML = `<span class="small muted">Stock status</span>${stockTag({ stock: +E.stock, th: +E.th })}`;
        }
        if (["name", "seoTitle", "seoDesc", "desc", "slug"].includes(k)) {
          const tt =
            E.seoTitle ||
            (E.name ? `${E.name} | Iqos Haven Dubai` : "Product title");
          const st = $("#serp-t");
          if (st)
            st.textContent = tt.slice(0, 62) + (tt.length > 62 ? "…" : "");
          const sd = $("#serp-d");
          if (sd) sd.textContent = (E.seoDesc || E.desc || "").slice(0, 158);
          const lab = el.closest(".field")?.querySelector(".cc");
          if (lab) {
            const max = k === "seoTitle" ? 60 : k === "seoDesc" ? 160 : 600;
            lab.textContent = `${v.length}/${max}`;
            lab.classList.toggle("over", v.length > max);
          }
        }
        if (k === "status" || (k === "cat" && E.isNew)) rerender();
      };
      FORM.peSpec = (el) => {
        S.ui.pe.spec[+el.dataset.i][+el.dataset.j] = el.value;
        setDirty(S.ui.pe.name || "this product");
      };
      ACT.specAdd = () => {
        S.ui.pe.spec.push(["", ""]);
        rerender();
        const ins = $$("#pe-specs input");
        ins[ins.length - 2]?.focus();
      };
      ACT.specRm = (t) => {
        S.ui.pe.spec.splice(+t.dataset.i, 1);
        setDirty(S.ui.pe.name);
        rerender();
      };
      function mediaRefresh() {
        const E = S.ui.pe;
        const b = $("#pe-media-b");
        if (b) b.innerHTML = peMedia(E);
        const h = $("#pe-media-c .card-h .sub");
        if (h) h.textContent = `· ${E.imgs.length}/8`;
        setDirty(E.name || "this product");
        bindMedia();

      ACT.imgMove = (t) => {
        const E = S.ui.pe;
        const i = +t.dataset.i,
          j = i + +t.dataset.d;
        if (j < 0 || j >= E.imgs.length) return;
        [E.imgs[i], E.imgs[j]] = [E.imgs[j], E.imgs[i]];
        mediaRefresh();
      };
      ACT.imgPrim = (t) => {
        const E = S.ui.pe;
        const [im] = E.imgs.splice(+t.dataset.i, 1);
        E.imgs.unshift(im);
        mediaRefresh();
        toast("Primary image updated");
      };
      ACT.imgRm = (t) => {
        const E = S.ui.pe;
        confirmDlg({
          title: "Delete this image?",
          body: "It will be removed from the product when you save.",
          ok: "Delete image",
          danger: true,
          icon: "trash",
          onOk: () => {
            E.imgs.splice(+t.dataset.i, 1);
            mediaRefresh();
          },
        });
      };
      ACT.imgSample = () => {
        const E = S.ui.pe;
        if (E.imgs.length >= 8) {
          toast("Up to 8 images per product", "err");
          return;
        }
        const ks = ["r0", "r1", "r2"];
        E.imgs.push({ k: ks[E.imgs.length % 3] });
        delete E.err.imgs;
        mediaRefresh();
        flowAuto();
      };
      FORM.peFiles = (el) => {
        addFiles([...el.files]);
        el.value = "";
      };
      function addFiles(files) {
        const E = S.ui.pe;
        files = files.filter((f) => /^image\//.test(f.type));
        if (!files.length) {
          toast("Choose PNG, JPG or WebP images", "err");
          return;
        }
        files.slice(0, 8 - E.imgs.length).forEach((f) => {
          if (f.size > 8e6) {
            toast(`${esc(f.name)} is over 8 MB`, "err");
            return;
          }
          const r = new FileReader();
          r.onload = () => {
            E.imgs.push({ src: r.result, name: f.name });
            delete E.err.imgs;
            mediaRefresh();
            flowAuto();
          };
          r.readAsDataURL(f);
        });
      }
      function bindMedia() {
        const drop = $("#pe-drop");
        if (drop) {
          ["dragenter", "dragover"].forEach((ev) =>
            drop.addEventListener(ev, (e) => {
              if (e.dataTransfer.types.includes("Files")) {
                e.preventDefault();
                drop.classList.add("over");
              }
            }),
          );
          ["dragleave", "drop"].forEach((ev) =>
            drop.addEventListener(ev, () => drop.classList.remove("over")),
          );
          drop.addEventListener("drop", (e) => {
            e.preventDefault();
            addFiles([...e.dataTransfer.files]);
          });
        }
        let from = null;
        $$("#pe-media .mtile").forEach((t) => {
          t.addEventListener("dragstart", (e) => {
            from = +t.dataset.i;
            t.classList.add("dragging");
            e.dataTransfer.effectAllowed = "move";
            e.dataTransfer.setData("text/plain", String(from));
          });
          t.addEventListener("dragend", () => t.classList.remove("dragging"));
          t.addEventListener("dragover", (e) => {
            if (from != null) {
              e.preventDefault();
              t.classList.add("over");
            }
          });
          t.addEventListener("dragleave", () => t.classList.remove("over"));
          t.addEventListener("drop", (e) => {
            e.preventDefault();
            t.classList.remove("over");
            const to = +t.dataset.i;
            if (from == null || from === to) return;
            const E = S.ui.pe;
            const [m] = E.imgs.splice(from, 1);
            E.imgs.splice(to, 0, m);
            from = null;
            mediaRefresh();
          });
        });
      }
      ACT.peSave = (t) => {
        const E = S.ui.pe;
        const m = t.dataset.m;
        const publish =
          m === "publish" || (m === "save" && E.status === "published");
        E.err = {};
        if (!E.name.trim()) E.err.name = "Enter a product name.";
        if (publish || m === "save") {
          if (!E.cat) E.err.cat = "Choose a category.";
          if (!E.b) E.err.b = "Choose a brand.";
          if (!E.sku.trim()) E.err.sku = "Enter a SKU.";
          else if (P.some((p) => p.sku === E.sku.trim() && p.id !== E.id))
            E.err.sku = "This SKU is already used by another product.";
          if (!(+E.price > 0)) E.err.price = "Enter a price above 0.";
        }
        if (publish) {
          if (!E.imgs.length)
            E.err.imgs = "Add at least one image before publishing.";
          if (E.desc.trim().length < 20)
            E.err.desc = "Add a description of at least 20 characters.";

        if (E.slug && !/^[a-z0-9-]+$/.test(E.slug))
          E.err.slug = "Use lowercase letters, numbers and hyphens only.";
        if (Object.keys(E.err).length) {
          rerender();
          toast("Fix the highlighted fields", "err");
          const f = $(".input.err,.select.err,.textarea.err");
          f && f.scrollIntoView({ block: "center" });
          return;
        }
        busy(
          t,
          m === "draft" ? "Saving…" : "Publishing…",
          () => {
            let p;
            if (E.isNew) {
              const id =
                slugify(E.name) + "-" + Math.random().toString(36).slice(2, 5);
              const isKit = E.cat === "kit";
              p = {
                id,
                b: E.b,
                name: E.name,
                type: isKit ? "kit" : "disposable",
                cat: E.cat,
                price: +E.price,
                fl: [{ n: "Grape Ice" }, { n: "Peach Ice" }],
                cols: ["Ocean"],
                specs: {
                  watt: 25,
                  mah: 1000,
                  pod: 2,
                  coil: "0.8",
                  charge: "USB-C",
                  screen: "LED",
                  box: "Device",
                },
                puffs: 7000,
                screen: false,
                mah: 500,
                rank: 60,
                stock: +E.stock,
                th: +E.th,
                deleted: null,
                created: new Date(NOW),
                wish: 0,
              };
              P.push(p);
              byId[id] = p;
            } else p = byId[E.id];
            Object.assign(p, {
              name: E.name.trim(),
              cat: E.cat || p.cat,
              b: E.b || p.b,
              sku:
                E.sku.trim().toUpperCase() ||
                "DRAFT-" + p.id.slice(0, 6).toUpperCase(),
              price: +E.price || 0,
              imgs: E.imgs.map((x) => ({ ...x })),
              th: +E.th,
              desc: E.desc,
              spec: E.spec.filter((s) => s[0] || s[1]),
              slug: E.slug || slugify(E.name),
              seo: { title: E.seoTitle, desc: E.seoDesc, og: E.og },
              status: publish
                ? "published"
                : m === "draft"
                  ? "draft"
                  : E.status,
            });
            if (E.isNew) p.stock = +E.stock;

            S.ui.pe = null;
            if (E.isNew) go("product", { id: p.id }, { force: true });
            else rerender();
            toast(
              publish
                ? `${esc(p.name)} is live on the store`
                : m === "draft"
                  ? "Draft saved"
                  : "Changes saved",
            );
            flowAuto();
          },
          600,
        );
      };

      /* ================= INVENTORY ================= */
      VIEWS.inventory = (pr) => {
        const u = ui("inv", { tab: "all", q: "", page: 1, cat: "" });
        if (pr.tab) {
          u.tab = pr.tab;
          u.page = 1;
          delete pr.tab;
        }
        const base = live();
        const cnt = {
          all: base.length,
          in: base.filter((p) => stockState(p) === "in").length,
          low: base.filter((p) => stockState(p) === "low").length,
          out: base.filter((p) => stockState(p) === "out").length,
        };
        let list =
          u.tab === "all" ? base : base.filter((p) => stockState(p) === u.tab);
        if (u.q) {
          const q = u.q.toLowerCase();
          list = list.filter(
            (p) =>
              p.name.toLowerCase().includes(q) ||
              p.sku.toLowerCase().includes(q),
          );
        }
        if (u.cat) list = list.filter((p) => p.cat === u.cat);
        list = [...list].sort((a, b) =>
          u.tab === "all" ? a.name.localeCompare(b.name) : a.stock - b.stock,
        );
        const units = base.reduce((s, p) => s + Math.max(0, p.stock), 0);
        const per = 15;
        const rows = list.slice((u.page - 1) * per, u.page * per);
        const tabs = [
          ["all", "All", ""],
          ["in", "In stock", "ok"],
          ["low", "Low stock", "warn"],
          ["out", "Out of stock", "err"],
        ];
        return `<div class="page">
  ${pageHead("Inventory", `${units.toLocaleString()} units across ${plural(base.length, "product")}`, `${isOwner() ? `<button class="btn btn-s hide-m" data-a="exportCsv" data-k="inventory">${ico("download")}Export CSV</button>` : ""}`)}
  <div class="kpis">${tabs.map(([k, l, tone]) => `<button class="kpi" data-a="uiSet" data-u="inv" data-k="tab" data-v="${k}" aria-pressed="${u.tab === k}" style="${u.tab === k ? "border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)" : ""}" ${k === "low" ? 'id="inv-low-tab"' : ""}><span class="kpi-l">${tone ? `<span class="dotc" style="background:var(--${tone})"></span>` : ""}${l}</span><span class="kpi-v">${cnt[k]}</span><span class="kpi-f"><span class="delta-c">${k === "all" ? "products tracked" : k === "in" ? "above threshold" : k === "low" ? "at or below threshold" : "still visible on store"}</span></span></button>`).join("")}</div>
  <div class="toolbar"><div class="search">${ico("search")}<label class="sr" for="iq">Search inventory</label><input id="iq" type="search" placeholder="Search product or SKU" value="${esc(u.q)}" data-f="uiQ" data-u="inv"></div><select class="fsel" data-f="uiSel" data-u="inv" data-k="cat" aria-label="Category"><option value="">All categories</option>${CATS.filter(
    (c) => !c.deleted,
  )
    .map(
      (c) =>
        `<option value="${c.id}" ${u.cat === c.id ? "selected" : ""}>${esc(c.name)}</option>`,
    )
    .join("")}</select></div>

              desc: p.seo.desc,

      }
      const SEOX = new Map();
      function seoIssues(p) {

        else if (p.desc.length > 160) is.push("Description over 160");

        const issues = pg.filter((p) => seoIssues(p).length).length;
        if (u.type) pg = pg.filter((p) => p.type === u.type);
        if (u.only) pg = pg.filter((p) => seoIssues(p).length);

      /* ---------- global search ---------- */
      function searchHtml(q) {
        q = q.trim().toLowerCase();
        if (q.length < 2)
          return `<div style="padding:16px" class="small muted">Type at least 2 characters. Search by order ID (e.g. ${ORD[0].id}), product, SKU, customer or phone.</div>`;
        const d = q.replace(/\D/g, "");
        const os = ORD.filter(
          (o) =>
            o.id.toLowerCase().includes(q) ||
            o.name.toLowerCase().includes(q) ||
            (d.length >= 4 && o.phone.replace(/\D/g, "").includes(d)),
        ).slice(0, 4);
        const ps = live()
          .filter(
            (p) =>
              p.name.toLowerCase().includes(q) ||
              p.sku.toLowerCase().includes(q),
          )
          .slice(0, 4);
        const cs = CUS.filter(
          (c) =>
            c.orders.length &&
            (c.name.toLowerCase().includes(q) ||
              (d.length >= 4 && c.phone.replace(/\D/g, "").includes(d))),
        ).slice(0, 3);
        if (!os.length && !ps.length && !cs.length)
          return emptyState(
            "search",
            "No results",
            `Nothing matches “${esc(q)}”.`,
          );
        const g = (t, items) =>
          items.length
            ? `<div class="nav-g" style="padding:10px 14px 4px">${t}</div>${items.join("")}`
            : "";
        return `<div class="menu" style="padding:0 6px 8px">${g(
          "Orders",
          os.map(
            (o) =>
              `<button data-a="gsGo" data-r="order" data-id="${o.id}"><span class="mono" style="font-weight:500">${o.id}</span><span class="muted small" style="flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(o.name)}</span>${stBadge(o.status)}</button>`,
          ),
        )}${g(
          "Products",
          ps.map(
            (p) =>
              `<button data-a="gsGo" data-r="product" data-id="${p.id}">${thumb(p)}<span style="flex:1">${esc(p.name)}</span><span class="mono xs muted">${p.sku}</span></button>`,
          ),
        )}${g(
          "Customers",
          cs.map(
            (c) =>
              `<button data-a="gsGo" data-r="customer" data-id="${c.id}"><span class="av" style="width:26px;height:26px;font-size:10px">${initials(c.name)}</span><span style="flex:1">${esc(c.name)}</span><span class="mono xs muted">${c.phone}</span></button>`,
          ),
        )}</div>`;
      }

        {
          n: "M1",
          name: "Phone: new order → update status",
          mobile: true,
          steps: [
            {
              t: "On the phone dashboard, tap the pending orders alert.",
              run: () => {
                loginAs("owner");
                setDev("phone");
                simulateOrder();
                go("dashboard", {}, { force: true });
              },
              hl: ".attn .attn-i:first-child",
              done: () => S.route === "orders",
            },
            {
              t: "Orders become cards. Tap the newest order.",
              run: () => {},
              hl: ".only-m .mrow:first-child",
              done: () => S.route === "order",
            },
            {
              t: "The next status is a thumb-reach button at the bottom. Tap Confirm order.",
              run: () => {},
              hl: "#btn-advance-m",
              done: () => ordById[S.params.id]?.status === "confirmed",
            },
            {
              t: "Keep going through Processing and Out for delivery the same way.",
              run: () => {},
              hl: "#btn-advance-m",
            },
          ],
        },
        {
          n: "M2",
          name: "Phone: low stock → update stock",
          mobile: true,
          steps: [
            {
              t: "Scroll to Low stock on the dashboard and tap Update.",
              run: () => {
                loginAs("owner");
                setDev("phone");
                go("dashboard", {}, { force: true });
                setTimeout(() => {
                  const b = $(`#low-${lowFirst().id}`);
                  b && b.scrollIntoView({ block: "center" });
                }, 150);
              },
              hl: () => `#low-${lowFirst().id}`,
              done: () => !!$("#btn-adj-save"),
            },
            {
              t: "Use the large stepper or a quick amount, then save.",
              run: () => {},
              hl: "#btn-adj-save",
              done: () => S.flowTag === "stock",
            },
            {
              t: "Stock saved. The dashboard alert updates immediately.",
              run: () => {},
            },
          ],
        },
        {
          n: "M3",
          name: "Phone: order → WhatsApp customer",
          mobile: true,
          steps: [
            {
              t: "Open a pending order and tap the green WhatsApp button.",
              run: () => {
                loginAs("owner");
                setDev("phone");
                go("order", { id: pendingOrder().id }, { force: true });
              },
              hl: "#btn-wa-m",
              done: () => !!$("#wa-go"),
            },
            {
              t: "Choose a template and tap Open WhatsApp. The WhatsApp app opens with the message ready.",
              run: () => {},
              hl: "#wa-go",
              done: () => S.flowTag === "wa",
            },
            {
              t: "Done. Use your phone's back gesture to return to the admin.",
              run: () => {},
            },
          ],
        },
      ];
      function setDev(d) {
        S.dev = d;
        applyDev();
      }
      ACT.flowStart = (t) => {
        const i = +t.dataset.i;
        S.pmenu = null;
        S.guide = false;
        closeLayer(true);
        closePop();
        S.dirty = null;
        discardDrafts();
        const f = FLOWS[i];
        if (!f.mobile && S.dev === "phone") setDev("desktop");
        S.flow = { i, k: 0 };
        S.flowTag = null;
        flowRun();
      };
      function flowRun() {
        const f = FLOWS[S.flow.i];
        const st = f.steps[S.flow.k];
        S.flowTag = null;
        try {
          st.run && st.run();
        } catch (e) {
          console.warn(e);
        }
        render();
        setTimeout(flowHighlight, 60);
      }
      function coachHtml() {
        const f = FLOWS[S.flow.i];
        const st = f.steps[S.flow.k];
        const last = S.flow.k === f.steps.length - 1;
        return `<div class="coach" role="status" aria-live="polite"><span class="cn">${f.n} · ${S.flow.k + 1}/${f.steps.length}</span><div class="ct"><b>${esc(f.name)}</b>${esc(st.t)}</div>${st.fill ? `<button data-a="flowFill" title="Fill example">${ico("wand")}<span class="sr">Fill example</span></button>` : ""}${S.flow.k > 0 ? `<button data-a="flowPrev" aria-label="Previous step">${ico("cl")}</button>` : ""}<button class="nx" data-a="${last ? "flowEnd" : "flowNext"}">${last ? "Finish" : "Next"}</button><button data-a="flowEnd" aria-label="Exit flow">${ico("x")}</button></div>`;
      }
      function coachRefresh() {
        const c = $(".coach");
        if (c && S.flow) c.outerHTML = coachHtml();
        else if (S.flow && S.auth && !c) {
          const a = $(".app");
          a && a.insertAdjacentHTML("afterend", coachHtml());
        }
      }
      function flowHighlight() {
        $$(".hl").forEach((e) => e.classList.remove("hl"));
        if (!S.flow) return;
        const st = FLOWS[S.flow.i].steps[S.flow.k];
        if (!st.hl) return;
        const sel = typeof st.hl === "function" ? st.hl() : st.hl;
        let el = null;
        for (const s of sel.split(",")) {
          const c = $$(s.trim()).find((x) => x.offsetParent !== null);
          if (c) {
            el = c;
            break;
          }
        }
        if (el) el.classList.add("hl");
        if (!S.auth) {
          const r = $("#root");
          if (r && !$(".coach")) {
            r.insertAdjacentHTML("beforeend", coachHtml());
          }
        }
      }
      ACT.flowNext = () => {
        const f = FLOWS[S.flow.i];
        if (S.flow.k < f.steps.length - 1) {
          S.flow.k++;
          closePop();
          if (
            OVL.length &&
            ![
              "#btn-adj-save",
              "#btn-cp-save",
              "#btn-staff-save",
              "#wa-go",
            ].includes(f.steps[S.flow.k].hl)
          )
            closeLayer(true);
          flowRun();
        }
      };
      ACT.flowPrev = () => {
        if (S.flow.k > 0) {
          S.flow.k--;
          closeLayer(true);
          closePop();
          flowRun();
        }
      };
      ACT.flowEnd = () => {
        S.flow = null;
        $$(".hl").forEach((e) => e.classList.remove("hl"));
        $(".coach")?.remove();
        toast("Flow finished. Keep exploring, or pick another flow.", "info");
      };
      ACT.flowFill = () => {
        const st = FLOWS[S.flow.i].steps[S.flow.k];
        st.fill && st.fill();
        setTimeout(() => {
          flowAuto();
          flowHighlight();
        }, 30);
      };
      function flowAuto(tag) {
        if (tag) S.flowTag = tag;
        if (!S.flow) return;
        setTimeout(() => {
          if (!S.flow) return;
          const f = FLOWS[S.flow.i];
          const st = f.steps[S.flow.k];
          let ok = false;
          try {
            ok = st.done && st.done();
          } catch (e) {}
          if (ok && S.flow.k < f.steps.length - 1) {
            S.flow.k++;
            const nx = f.steps[S.flow.k];
            S.flowTag = null;
            try {
              nx.run && nx.run();
            } catch (e) {}
            if (!$(".coach")) render();
            else coachRefresh();
          } else coachRefresh();
          flowHighlight();
        }, 80);
      }
      function flowSync() {
        if (S.flow) flowAuto();
      }
      /* hook tags from actions */
      const _rvSet = ACT.rvSet;
      ACT.rvSet = (t) => {
        _rvSet(t);
        flowAuto("rv");
      };
      const _cpSave = ACT.cpSave;
      ACT.cpSave = (t) => {
        const before = COUPONS.length;
        _cpSave(t);
        setTimeout(() => {
          if (COUPONS.length > before || !$("#cp-b")) flowAuto("cp");
        }, 620);
      };
      const _sfSave = ACT.sfSave;
      ACT.sfSave = (t) => {
        _sfSave(t);
        setTimeout(() => {
          if (!$("#sf-b")) flowAuto("staff");
        }, 620);
      };
      const _adjSave = ACT.adjSave;
      ACT.adjSave = (t) => {
        _adjSave(t);
        setTimeout(() => {
          if (!$("#btn-adj-save")) flowAuto("stock");
        }, 520);
      };

      /* ================= EVENTS ================= */
      document.addEventListener("click", (e) => {
        const t = e.target.closest("[data-a]");
        if (!t) return;
        if (t.closest("#frame") === null && !t.closest("#pbar")) return;
        const a = t.dataset.a;
        if (
          t.tagName === "A" &&
          a !== "waOpened" &&
          a !== "waModal" &&
          a !== "viewStore"
        )
          e.preventDefault();
        if (t.tagName === "BUTTON" && t.type === "submit" && t.form) return;
        if (t.disabled) return;
        if (a === "go") {
          e.preventDefault();
          let p = {};
          try {
            p = t.dataset.p ? JSON.parse(t.dataset.p) : {};
          } catch (x) {}
          closePop();
          if (OVL.length) closeLayer(true);
          go(t.dataset.r, p);
          return;
        }
        const fn = ACT[a];
        if (fn) {
          fn(t, e);
        }
      });
      document.addEventListener("keydown", (e) => {
        if (
          (e.key === "Enter" || e.key === " ") &&
          e.target.matches("[role=link][data-a]")
        ) {
          e.preventDefault();
          e.target.click();
        }
      });
      const TEXTY = (el) =>
        el.tagName === "TEXTAREA" ||
        (el.tagName === "INPUT" &&
          !["checkbox", "radio", "file"].includes(el.type));
      document.addEventListener("input", (e) => {
        const el = e.target;
        if (!el.dataset || !el.dataset.f) return;
        if (!TEXTY(el) || el.dataset.ev === "change") return;
        FORM[el.dataset.f] && FORM[el.dataset.f](el);
      });
      document.addEventListener("change", (e) => {
        const el = e.target;
        if (!el.dataset || !el.dataset.f) return;
        if (TEXTY(el) && el.dataset.ev !== "change") return;
        FORM[el.dataset.f] && FORM[el.dataset.f](el);
      });
      document.addEventListener("focusin", (e) => {
        if (e.target.id === "gs" && e.target.value.length >= 2)
          FORM.gsearch(e.target);
      });
      window.addEventListener("beforeunload", (e) => {
        if (S.dirty) {
          e.preventDefault();
          e.returnValue = "";
        }
      });

      /* ================= BOOT ================= */
      function start() {
        applyTheme();
        applyDev();
        const h = (location.hash || "").replace("#", "");
        if (h === "guide") {
          S.guide = true;
        }
        if (h === "staff") {
          S.auth = true;
          S.role = "staff";
        } else if (h && h !== "login" && h !== "guide") {
          S.auth = true;
          S.role = "owner";
          if (VIEWS[h]) S.route = h;
        }
        render();
      }
      start();
    </script>
  </body>
</html>
