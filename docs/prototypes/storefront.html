        flex-direction: column;
        gap: 12px;
        min-width: 0;
      }
      .card .art {
        position: relative;
        aspect-ratio: 4/5;
        border-radius: var(--r-md);
        overflow: hidden;
        display: block;
        max-width: 100%;
      }
      .card .art svg {
        width: 100%;
        height: 100%;
        display: block;
        transition: transform 0.45s var(--ease);
      }
      .card:hover .art svg {
        transform: translateY(-5px) scale(1.025);
      }
      .card .badges {
        position: absolute;
        top: 10px;
        left: 10px;
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .card .wish {
        position: absolute;
        top: 8px;
        right: 8px;
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.88);
        display: grid;
        place-items: center;
        transition:
          transform 0.2s var(--ease),
          background 0.2s;
      }
      .card .wish:hover {
        background: #fff;
        transform: scale(1.06);
      }
      .wish[aria-pressed="true"] .i {
        fill: var(--coral);
        stroke: var(--coral);
      }
      .card-foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-top: 6px;
        min-height: 40px;
      }
      .card-foot .price {
        margin-top: 0;
        min-width: 0;
      }
      .card .qadd {
        position: relative;
        flex: none;
        height: 40px;
        min-width: 40px;
        padding: 0 11px;
        border-radius: var(--r-pill);
        background: var(--ink);
        color: #fff;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        font-size: 13px;
        font-weight: 500;
        box-shadow: var(--sh-2);
        transition:
          transform 0.2s var(--ease),
          background 0.2s;
      }
      .card .qadd:hover {
        background: var(--primary-hover);
      }
      .card .qadd span {
        display: none;
      }
      @container app (min-width:1040px) {
        .card .qadd span {
          display: inline;
        }
      }
      @media (hover: none) {
        .card .qadd {
          opacity: 1 !important;
          transform: none !important;
        }
      }
      .card.oos .art svg {
        opacity: 0.45;
        filter: grayscale(0.6);
      }
      .card .info {
        display: flex;
        flex-direction: column;
        gap: 3px;
        min-width: 0;
      }
      .card .brandname {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--ink-3);
      }
      .card .name {
        font-size: 15px;
        font-weight: 500;
        line-height: 1.3;
        letter-spacing: -0.01em;
        text-decoration: none;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .card .name::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 0;
      }
      .card .art,
      .card .wish,
      .card .qadd {
        z-index: 1;
      }
      .card .art {
        z-index: 0;
      }
      .card .wish,
      .card .qadd,
      .card .badges {
        z-index: 2;
      }
      .card .meta {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-size: 12.5px;
        color: var(--ink-3);
        font-family: var(--mono);
        letter-spacing: -0.01em;
      }

      .card .sw {
        display: flex;
        gap: 4px;
        margin-top: 2px;
      }
      .card .sw i {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        border: 1px solid rgba(0, 0, 0, 0.08);
      }
      .sk {
        border-radius: var(--r-md);
        background: linear-gradient(
          90deg,
          var(--surface-2) 0%,
          #f6f8f9 50%,
          var(--surface-2) 100%
        );
        background-size: 200% 100%;
        animation: sk 1.1s linear infinite;
      }
      @keyframes sk {
        to {
          background-position: -200% 0;
        }
      }
      .sk-card {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .sk-card .a {
        aspect-ratio: 4/5;
      }
      .sk-card .l {
        height: 12px;
        border-radius: 6px;
      }

      /* puff discovery */
      .puffs {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
      }
      .puff {
        display: flex;
        flex-direction: column;
        gap: 14px;
        padding: 16px;
        border-radius: var(--r-md);
        background: var(--surface);
        border: 1px solid var(--line);
        text-decoration: none;
        transition:
          border-color 0.2s,
          transform 0.2s var(--ease);
      }
      .puff:hover {
        border-color: var(--ink);
        transform: translateY(-2px);
      }
      .puff .n {
        font-family: var(--mono);
        font-size: clamp(17px, 4cqw, 26px);
        font-weight: 500;
        letter-spacing: -0.04em;
        line-height: 1;
      }
      .puff .bars {
        display: flex;
        gap: 3px;
        align-items: flex-end;
        height: 26px;
      }
      .puff .bars i {
        width: 6px;
        border-radius: 2px;
        background: var(--line);
      }
      .puff .bars i.on {
        background: var(--ink);
      }
      .puff .l {
        font-size: 12.5px;
        color: var(--ink-3);
      }

      /* campaign */
      .camp {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        border-radius: var(--r-lg);
        overflow: hidden;
        background: var(--ink);
        color: #fff;
        position: relative;
        isolation: isolate;
      }
      @container app (min-width:720px) {
        .camp {
          grid-template-columns: 1.2fr 1fr;
        }
      }
      .camp-copy {
        padding: 28px 22px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        align-items: flex-start;
      }
      @container app (min-width:720px) {
        .camp-copy {
          padding: 44px;
        }
      }
      .camp .eyebrow {
        color: var(--saffron);
      }
      .camp h2 {
        font-size: clamp(26px, 5cqw, 40px);
        line-height: 1.08;
        letter-spacing: -0.03em;
        font-weight: 600;
        margin: 0;
        text-wrap: balance;
      }
      .camp p {
        color: #c9cfd6;
        max-width: 40ch;
      }
      .code {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        height: 44px;
        padding: 0 6px 0 14px;
        border: 1.5px dashed rgba(255, 255, 255, 0.4);
        border-radius: var(--r-sm);
        font-family: var(--mono);
        font-size: 14px;
        letter-spacing: 0.06em;
      }
      .code button {
        height: 32px;
        padding: 0 10px;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.12);
        font-family: var(--font);
        font-size: 12.5px;
        letter-spacing: 0;
        display: inline-flex;
        gap: 6px;
        align-items: center;
      }
      .code button:hover {
        background: rgba(255, 255, 255, 0.22);
      }
      .camp-art {
        position: relative;
        min-height: 220px;
        background: var(--saffron);
      }
      .camp-art svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .camp .btn-primary {
        background: #fff;
        color: var(--ink);
      }
      .camp .btn-primary:hover {
        background: #e9edee;
      }
      .camp-meta {
        font-size: 12px;
        color: #9aa3ad;
      }

      /* why */
      .why {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 22px 16px;
      }
      @container app (min-width:900px) {
        .why {
          grid-template-columns: repeat(4, minmax(0, 1fr));
          gap: 24px;
        }
      }
      .why-item {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .why-ic {
        width: 48px;
        height: 48px;
        border-radius: 14px;
        display: grid;
        place-items: center;
      }
      .why-item h3 {
        font-size: 15.5px;
        font-weight: 600;
        margin: 0;
        letter-spacing: -0.01em;
      }
      .why-item p {
        font-size: 13.5px;
        color: var(--ink-2);
      }

      /* faq */
      .faq {
        display: flex;
        flex-direction: column;
        border-top: 1px solid var(--line);
      }
      .faq details {
        border-bottom: 1px solid var(--line);
      }
      .faq summary {
        list-style: none;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        padding: 18px 2px;
        font-weight: 500;
        font-size: 15.5px;
        cursor: pointer;
        border-radius: 6px;
      }
      .faq summary::-webkit-details-marker {
        display: none;
      }
      .faq summary .i {
        transition: transform 0.25s var(--ease);
      }
      .faq details[open] summary .i {
        transform: rotate(45deg);
      }
      .faq .a {
        padding: 0 2px 18px;
        color: var(--ink-2);
        max-width: 68ch;
      }
      .two {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 28px;
      }
      @container app (min-width:900px) {
        .two {
          grid-template-columns: 0.8fr 1.2fr;
          gap: 56px;
        }
      }

      /* wa band */
      .waband {
        display: grid;
        gap: 18px;
        align-items: center;
        padding: 24px;
        border-radius: var(--r-lg);
        background: var(--mint-soft);
      }
      @container app (min-width:720px) {
        .waband {
          grid-template-columns: auto 1fr auto;
          padding: 28px 32px;
          gap: 24px;
        }
      }
      .waband .ic {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: var(--wa);
        color: #fff;
        display: grid;
        place-items: center;
      }

      /* footer */
      .foot {
        background: var(--chrome);
        color: var(--chrome-ink);
        margin-top: 24px;
      }
      .foot a {
        color: var(--chrome-ink);
        text-decoration: none;
      }
      .foot a:hover {
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .foot-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 28px 16px;
        padding-block: 44px 28px;
      }
      @container app (min-width:900px) {
        .foot-grid {
          grid-template-columns: 1.6fr repeat(4, minmax(0, 1fr));
        }
      }
      .foot-brand {
        grid-column: 1/-1;
        display: flex;
        flex-direction: column;
        gap: 12px;
        max-width: 34ch;
      }
      @container app (min-width:900px) {
        .foot-brand {
          grid-column: auto;
        }
      }
      .foot-brand p {
        color: var(--chrome-ink-2);
        font-size: 13.5px;
      }
      .foot h4 {
        font-size: 11.5px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--chrome-ink-2);
        margin: 0 0 12px;
        font-weight: 600;
      }
      .foot ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 9px;
        font-size: 14px;
      }
      .social {
        display: flex;
        gap: 10px;
      }
      .social a {
        width: 40px;
        height: 40px;
        display: grid;
        place-items: center;
        border-radius: 12px;
        transition:
          transform 0.2s var(--ease),
          opacity 0.2s;
      }
      .social a:hover {
        transform: translateY(-2px);
        text-decoration: none !important;
      }
      .social svg {
        width: 24px;
        height: 24px;
        display: block;
      }
      .so-fb {
        background: transparent;
      }
      .so-fb svg {
        width: 34px;
        height: 34px;
      }
      .so-ig {
        background: radial-gradient(
          circle at 30% 107%,
          #fdf497 0%,
          #fdf497 5%,
          #fd5949 45%,
          #d6249f 60%,
          #285aeb 90%
        );
      }
      .foot-warn {
        font-size: 12.5px;
        color: var(--chrome-ink-2);
        max-width: 80ch;
      }
      .foot-notice {
        border: 1px solid #2c3440;
        border-radius: var(--r-md);
        padding: 16px;
        display: flex;
        gap: 14px;
        align-items: flex-start;
        font-size: 13px;
        color: var(--chrome-ink-2);
      }
      .foot-notice b {
        color: #fff;
        font-weight: 600;
      }
      .age-mark {
        flex: none;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 1.5px solid var(--chrome-ink);
        display: grid;
        place-items: center;
        font-weight: 500;
        font-size: 14px;
        color: #fff;
      }
      .foot-bottom {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 20px;
        justify-content: space-between;
        padding-block: 20px 28px;
        font-size: 12.5px;
        color: var(--chrome-ink-2);
        border-top: 1px solid #222832;
        margin-top: 24px;
      }
      .foot-pad {
        padding-bottom: calc(64px + env(safe-area-inset-bottom, 0px));
      }
      @container app (min-width:720px) {
        .foot-pad {
          padding-bottom: 0;
        }
      }

      /* ---------- overlays: bottom nav, wa fab, sticky atc, compare tray ---------- */
      .bnav {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(255, 255, 255, 0.96);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border-top: 1px solid var(--line);
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @container app (min-width:720px) {
        .bnav {
          display: none;
        }
      }
      .bnav button {
        height: 62px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3px;
        font-size: 11px;
        font-weight: 500;
        color: var(--ink-3);
        position: relative;
      }
      .bnav button[aria-current="page"] {
        color: var(--ink);
      }
      .bnav button[aria-current="page"]::before {
        content: "";
        position: absolute;
        top: 0;
        width: 28px;
        height: 3px;
        border-radius: 0 0 3px 3px;
        background: var(--ink);
      }
      .bnav .count {
        top: 6px;
        right: calc(50% - 22px);
      }
      .wafab {
        position: absolute;
        right: 16px;
        bottom: calc(78px + env(safe-area-inset-bottom, 0px));
        height: 52px;
        width: 52px;
        border-radius: 50%;
        background: var(--wa);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        box-shadow: var(--sh-2);
        transition:
          transform 0.2s var(--ease),
          background 0.2s,
          width 0.3s var(--ease);
        overflow: hidden;
      }
      .wafab:hover {
        background: var(--wa-hover);
        transform: translateY(-2px);
      }

      .wafab span {
        display: none;
        font-weight: 500;
        font-size: 14px;
        white-space: nowrap;
      }
      @container app (min-width:720px) {
        .wafab {
          bottom: 24px;
          right: 24px;
          width: 56px;
          height: 56px;
          border-radius: 50%;
        }
      }
      .wafab.up {
        bottom: calc(140px + env(safe-area-inset-bottom, 0px));
      }
      @container app (min-width:720px) {
        .wafab.up {
          bottom: 96px;
        }
      }
      .satc {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        background: var(--surface);
        border-top: 1px solid var(--line);
        box-shadow: 0 -8px 24px -12px rgba(18, 22, 27, 0.2);
        padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
        display: flex;
        align-items: center;
        gap: 12px;
        transform: translateY(110%);
        transition: transform 0.3s var(--ease);
      }
      .satc.show {
        transform: none;
      }
      @container app (min-width:720px) {
        .satc {
          display: none;
        }
      }
      .satc .t {
        flex: 1;
        min-width: 0;
        line-height: 1.25;
      }
      .satc .t b {
        display: block;
        font-size: 13.5px;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .satc .t span {
        font-size: 12px;
        color: var(--ink-3);
      }
      .satc .ibtn {
        border: 1.5px solid var(--line-2);
        width: 48px;
        height: 48px;
        flex: none;
      }
      .satc .wa-mini {
        color: var(--wa);
      }
      .ctray {
        position: absolute;
        left: 12px;
        right: 12px;
        bottom: calc(74px + env(safe-area-inset-bottom, 0px));
        background: var(--ink);
        color: #fff;
        border-radius: var(--r-md);
        padding: 10px 10px 10px 16px;
        display: flex;
        align-items: center;
        gap: 10px;
        box-shadow: var(--sh-3);
        animation: enter 0.35s var(--ease);
      }
      @container app (min-width:720px) {
        .ctray {
          left: 50%;
          right: auto;
          transform: translateX(-50%);
          bottom: 24px;
          min-width: 440px;
        }
      }
      .ctray .thumbs {
        display: flex;
        gap: 4px;
      }
      .ctray .thumbs i {
        width: 34px;
        height: 34px;
        border-radius: 8px;
        overflow: hidden;
        display: block;
      }
      .ctray .thumbs svg {
        width: 100%;
        height: 100%;
      }
      .ctray .t {
        flex: 1;
        font-size: 13.5px;
        min-width: 0;
      }
      .ctray .btn {
        min-height: 40px;
        padding: 0 16px;
        font-size: 14px;
        background: #fff;
        color: var(--ink);
      }
      .ctray .ibtn {
        color: #fff;
        width: 38px;
        height: 38px;
      }
      .ctray .ibtn:hover {
        background: rgba(255, 255, 255, 0.12);
      }

      /* ---------- sheets ---------- */
      .backdrop {
        position: absolute;
        inset: 0;
        background: rgba(14, 17, 22, 0.42);
        opacity: 0;
        transition: opacity 0.25s;
        pointer-events: auto;
      }
      .sheet {
        position: absolute;
        background: var(--surface);
        display: flex;
        flex-direction: column;
        pointer-events: auto;
        transition:
          transform 0.32s var(--ease),
          opacity 0.25s;
        box-shadow: var(--sh-3);
        max-height: 100%;
      }
      .sheet.right {
        top: 0;
        right: 0;
        bottom: 0;
        width: min(440px, 100%);
        transform: translateX(100%);
      }
      .sheet.left {
        top: 0;
        left: 0;
        bottom: 0;
        width: min(360px, 88%);
        transform: translateX(-100%);
      }
      .sheet.bottom {
        left: 0;
        right: 0;
        bottom: 0;
        max-height: 88%;
        border-radius: 22px 22px 0 0;
        transform: translateY(100%);
      }
      .sheet.top {
        left: 0;
        right: 0;
        top: 0;
        bottom: 0;
        transform: translateY(-16px);
        opacity: 0;
      }
      @container app (min-width:720px) {
        .sheet.bottom {
          left: 50%;
          right: auto;
          bottom: auto;
          top: 50%;
          width: min(520px, calc(100% - 48px));
          max-height: 84%;
          border-radius: var(--r-lg);
          transform: translate(-50%, -46%);
          opacity: 0;
        }
        .sheet.top {
          bottom: auto;
          left: 50%;
          right: auto;
          top: 72px;
          width: min(720px, calc(100% - 48px));
          max-height: calc(100% - 100px);
          border-radius: var(--r-lg);
          transform: translate(-50%, -12px);
        }
        .sheet.bottom.filters-sheet {
          left: auto;
          right: 0;
          top: 0;
          bottom: 0;
          width: 400px;
          max-height: 100%;
          border-radius: 0;
          transform: translateX(100%);
          opacity: 1;
        }
      }
      .open .backdrop {
        opacity: 1;
      }
      .backdrop.clear {
        background: rgba(14, 17, 22, 0.06);
      }
      .sheet:focus {
        outline: none;
      }
      .sheet.pop {
        top: 76px;
        right: 24px;
        width: min(400px, calc(100% - 48px));
        max-height: min(620px, calc(100% - 100px));
        border-radius: var(--r-lg);
        border: 1px solid var(--line);
        transform-origin: calc(100% - 28px) 0;
        transform: translateY(-6px) scale(0.97);
        opacity: 0;
        transition:
          transform 0.24s cubic-bezier(0.2, 0.9, 0.3, 1),
          opacity 0.18s ease-out;
      }
      .sheet.pop::before {
        content: "";
        position: absolute;
        top: -7px;
        right: 22px;
        width: 12px;
        height: 12px;
        background: var(--surface);
        border-left: 1px solid var(--line);
        border-top: 1px solid var(--line);
        transform: rotate(45deg);
      }
      .open .sheet.pop {
        transform: none;
        opacity: 1;
      }
      .sheet.pop .sh-head {
        border-radius: var(--r-lg) var(--r-lg) 0 0;
      }
      .sheet.pop .sh-foot {
        border-radius: 0 0 var(--r-lg) var(--r-lg);
      }
      .sheet.pop .sh-body {
        padding: 16px 20px;
      }
      .open .sheet.right,
      .open .sheet.left,
      .open .sheet.bottom {
        transform: none;
        opacity: 1;
      }
      .open .sheet.top {
        transform: none;
        opacity: 1;
      }
      @container app (min-width:720px) {
        .open .sheet.bottom {
          transform: translate(-50%, -50%);
        }
        .open .sheet.top {
          transform: translate(-50%, 0);
        }
        .open .sheet.bottom.filters-sheet {
          transform: none;
        }
      }
      .sh-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 12px 14px 20px;
        border-bottom: 1px solid var(--line);
        flex: none;
      }
      .sh-head h2 {
        font-size: 17px;
        font-weight: 600;
        margin: 0;
        letter-spacing: -0.01em;
      }
      .sh-body {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        min-height: 0;
      }
      .sh-foot {
        flex: none;
        border-top: 1px solid var(--line);
        padding: 14px 20px calc(14px + env(safe-area-inset-bottom, 0px));
        display: flex;
        flex-direction: column;
        gap: 10px;
        background: var(--surface);
      }
      .grab {
        width: 40px;
        height: 4px;
        border-radius: 2px;
        background: var(--line-2);
        margin: 8px auto 0;
      }
      @container app (min-width:720px) {
        .grab {
          display: none;
        }
      }

      /* search */
      .sq-box {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px 10px 16px;
        border-bottom: 1px solid var(--line);
      }
      .sq-box input {
        flex: 1;
        border: 0;
        outline: none;
        font-size: 17px;
        height: 48px;
        background: transparent;
        min-width: 0;
      }
      .sq-box input::placeholder {
        color: var(--ink-3);
      }
      .sq-sec {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-bottom: 22px;
      }
      .sq-sec h3 {
        font-size: 11.5px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--ink-3);
        margin: 0;
        font-weight: 600;
      }
      .sq-chips {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .sq-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px;
        margin: 0 -8px;
        border-radius: var(--r-sm);
        text-decoration: none;
      }
      .sq-item:hover,
      .sq-item:focus-visible {
        background: var(--bg);
      }
      .sq-item .th {
        width: 52px;
        height: 60px;
        border-radius: 10px;
        overflow: hidden;
        flex: none;
      }
      .sq-item .th svg {
        width: 100%;
        height: 100%;
      }
      .sq-item .t {
        flex: 1;
        min-width: 0;
      }
      .sq-item .t b {
        display: block;
        font-weight: 500;
        font-size: 14.5px;
      }
      .sq-item .t span {
        font-size: 12.5px;
        color: var(--ink-3);
      }
      .sq-item mark {
        background: var(--saffron-soft);
        color: inherit;
        border-radius: 3px;
        padding: 0 1px;
      }
      .sq-all {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 14px 16px;
        border-radius: var(--r-sm);
        background: var(--bg);
        font-weight: 500;
        text-decoration: none;
      }

      /* menu */
      .mnav {
        display: flex;
        flex-direction: column;
      }
      .mnav a {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-height: 54px;
        padding: 0 4px;
        border-bottom: 1px solid var(--line);
        font-size: 16px;
        font-weight: 500;
        text-decoration: none;
      }
      .mnav a span.c {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--ink-3);
      }
      .mnav-sub {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        padding: 12px 0 4px;
      }
      .macc {
        border-bottom: 1px solid var(--line);
      }
      .macc-btn {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-height: 54px;
        padding: 0 4px;
        font-size: 16px;
        font-weight: 500;
        text-align: left;
        border-radius: 6px;
      }
      .macc-btn .i {
        transition: transform 0.3s var(--ease);
        color: var(--ink-3);
      }
      .macc.open .macc-btn .i {
        transform: rotate(180deg);
        color: var(--ink);
      }
      .macc-panel {
        display: grid;
        grid-template-rows: 0fr;
        transition: grid-template-rows 0.32s var(--ease);
      }
      .macc.open .macc-panel {
        grid-template-rows: 1fr;
      }
      .macc-in {
        overflow: hidden;
        min-height: 0;
      }
      .macc-in > a {
        padding-left: 14px !important;
        font-size: 15px !important;
        font-weight: 400 !important;
        color: var(--ink-2);
      }
      .macc-in > a:last-child {
        border-bottom: 0 !important;
      }
      .macc-in .mnav-sub a {
        padding-left: 12px;
      }
      .mnav .macc-all {
        display: flex;
        align-items: center;
        min-height: 44px;
        font-size: 14px !important;
        font-weight: 500 !important;
        color: var(--ink) !important;
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .mnav-sub a {
        min-height: 44px;
        border: 1px solid var(--line);
        border-radius: var(--r-sm);
        padding: 0 12px;
        font-size: 14px;
      }

      /* ---------- shop ---------- */
      .crumbs {
        display: flex;
        gap: 6px;
        align-items: center;
        font-size: 13px;
        color: var(--ink-3);
        flex-wrap: wrap;
        padding-top: 18px;
      }
      .crumbs a {
        text-decoration: none;
        color: var(--ink-3);
      }
      .crumbs a:hover {
        color: var(--ink);
        text-decoration: underline;
      }
      .crumbs .i {
        width: 14px;
        height: 14px;
      }
      .shop-head {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding-block: 14px 18px;
      }
      .bhero {
        display: grid;
        gap: 18px;
        align-items: center;
        padding: 24px;
        border-radius: var(--r-lg);
        margin-top: 16px;
        position: relative;
        overflow: hidden;
      }
      @container app (min-width:720px) {
        .bhero {
          grid-template-columns: 1fr auto;
          padding: 36px 40px;
        }
      }
      .bhero .bw {
        font-size: clamp(34px, 7cqw, 56px);
        line-height: 1;
      }
      .bhero .stats {
        display: flex;
        gap: 24px;
        font-size: 13px;
      }
      .bhero .stats b {
        display: block;
        font-family: var(--mono);
        font-size: 20px;
        font-weight: 500;
      }
      .toolbar {
        position: sticky;
        top: 96px;
        z-index: 5;
        background: rgba(242, 244, 245, 0.94);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        display: flex;
        align-items: center;
        gap: 8px;
        padding-block: 10px;
        margin-bottom: 8px;
        border-bottom: 1px solid var(--line);
      }
      @container app (min-width:720px) {
        .toolbar {
          top: 104px;
        }
      }
      @container app (min-width:1040px) {
        .toolbar {
          position: static;
          background: none;
          backdrop-filter: none;
          border: 0;
          padding-block: 0 6px;
        }
      }
      .toolbar .cnt {
        font-size: 13.5px;
        color: var(--ink-2);
        margin-right: auto;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .toolbar .sortsel {
        min-width: 0;
        max-width: 46%;
      }
      .sortsel {
        min-height: 40px;
        height: 40px;
        padding: 0 36px 0 14px;
        border-radius: var(--r-pill);
        font-size: 14px;
        width: auto;
        border: 1.5px solid var(--line);
      }
      .fbtn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        height: 40px;
        padding: 0 16px;
        border-radius: var(--r-pill);
        background: var(--ink);
        color: #fff;
        font-weight: 500;
        font-size: 14px;
      }
      .fbtn b {
        background: var(--saffron);
        color: var(--ink);
        border-radius: 10px;
        min-width: 20px;
        height: 20px;
        font-size: 11.5px;
        display: grid;
        place-items: center;
        padding: 0 5px;
      }
      .active-chips {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin: 6px 0 18px;
      }
      .shop-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 28px;
        padding-bottom: 40px;
      }
      @container app (min-width:1040px) {
        .shop-layout {
          grid-template-columns: 250px minmax(0, 1fr);
          gap: 36px;
        }
      }
      .shop-side {
        display: none;
      }
      @container app (min-width:1040px) {
        .shop-side {
          display: block;
          position: sticky;
          top: 124px;
          align-self: start;
          max-height: calc(100cqh - 136px);
          overflow: auto;
          padding-right: 6px;
        }
      }
      .fgroup {
        border: 0;
        margin: 0;
        padding: 0 0 18px;
        border-bottom: 1px solid var(--line);
        margin-bottom: 18px;
        min-width: 0;
      }
      .fgroup legend {
        font-size: 13px;
        font-weight: 600;
        padding: 0;
        margin-bottom: 10px;
        letter-spacing: -0.005em;
      }
      .fgroup .opts {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .fgroup .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        min-height: 40px;
        cursor: pointer;
        font-size: 14.5px;
      }
      .fgroup .cn {
        margin-left: auto;
      }
      .empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 14px;
        padding: 56px 20px;
        border-radius: var(--r-lg);
        background: var(--surface);
        border: 1px dashed var(--line-2);
      }
      .empty .ic {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: var(--surface-2);
        display: grid;
        place-items: center;
      }
      .empty p {
        color: var(--ink-2);
        max-width: 40ch;
      }

      /* ---------- PDP ---------- */
      .pdp {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 24px;
        padding-top: 10px;
        padding-bottom: 24px;
      }
      @container app (min-width:820px) {
        .pdp {
          grid-template-columns: minmax(0, 1.08fr) minmax(0, 1fr);
          gap: 48px;
          padding-top: 24px;
        }
      }
      .gal {
        min-width: 0;
      }
      @container app (min-width:820px) {
        .gal {
          position: sticky;
          top: 126px;
          align-self: start;
        }
      }
      .gal-track {
        display: flex;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        border-radius: var(--r-lg);
        scrollbar-width: none;
        margin-inline: -16px;
      }
      @container app (min-width:720px) {
        .gal-track {
          margin-inline: 0;
        }
      }
      .gal-track::-webkit-scrollbar {
        display: none;
      }
      .gal-slide {
        flex: 0 0 100%;
        scroll-snap-align: center;
        aspect-ratio: 1/1;
        max-height: 560px;
        position: relative;
      }
      .gal-slide svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      .gal-dots {
        display: flex;
        justify-content: center;
        gap: 6px;
        margin-top: 12px;
      }
      .gal-dots i {
        width: 6px;
        height: 6px;
        border-radius: 3px;
        background: var(--line-2);
        transition:
          width 0.25s var(--ease),
          background 0.25s;
      }
      .gal-dots i.on {
        width: 20px;
        background: var(--ink);
      }
      @container app (min-width:720px) {
        .gal-dots {
          display: none;
        }
      }
      .gal-thumbs {
        display: none;
        gap: 10px;
        margin-top: 12px;
      }
      @container app (min-width:720px) {
        .gal-thumbs {
          display: flex;
        }
      }
      .gal-thumbs button {
        width: 76px;
        height: 76px;
        border-radius: 12px;
        overflow: hidden;
        border: 2px solid transparent;
        transition: border-color 0.2s;
      }
      .gal-thumbs button[aria-current="true"] {
        border-color: var(--ink);
      }
      .gal-thumbs svg {
        width: 100%;
        height: 100%;
      }
      .gal-zoom {
        position: absolute;
        right: 12px;
        top: 12px;
        background: rgba(255, 255, 255, 0.88);
        border-radius: var(--r-pill);
        font-size: 12px;
        padding: 5px 10px;
        font-weight: 500;
      }
      .buy {
        display: flex;
        flex-direction: column;
        gap: 20px;
        min-width: 0;
      }
      .buy-top {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .buy .brandlink {
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        text-decoration: none;
        color: var(--ink-3);
      }
      .buy .brandlink:hover {
        color: var(--ink);
      }
      .buy .price .now {
        font-size: 26px;
      }
      .buy .price .was {
        font-size: 16px;
      }
      .rate-link {
        display: inline-flex;
        gap: 8px;
        align-items: center;
        font-size: 13px;
        color: var(--ink-2);
        text-decoration: none;
      }
      .rate-link:hover {
        text-decoration: underline;
      }
      .stock {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 13.5px;
        font-weight: 500;
      }
      .stock i {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--success);
      }
      .stock.no i {
        background: var(--error);
      }
      .stock.no {
        color: var(--error);
      }
      .opt-g {
        display: flex;
        flex-direction: column;
        gap: 10px;
        border: 0;
        margin: 0;
        padding: 0;
        min-width: 0;
      }
      .opt-g legend {
        font-size: 13.5px;
        font-weight: 500;
        padding: 0;
        margin-bottom: 10px;
      }
      .opt-g legend span {
        color: var(--ink-3);
        font-weight: 400;
      }
      .flv {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .flv button {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 42px;
        padding: 0 14px 0 10px;
        border-radius: var(--r-pill);
        border: 1.5px solid var(--line);
        background: var(--surface);
        font-size: 13.5px;
        font-weight: 500;
        transition: border-color 0.15s;
      }
      .flv button:hover {
        border-color: var(--ink-3);
      }
      .flv button[aria-pressed="true"] {
        border-color: var(--ink);
        box-shadow: inset 0 0 0 1px var(--ink);
      }
      .flv button i {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        flex: none;
      }
      .flv button.oos {
        color: var(--ink-3);
        text-decoration: line-through;
        border-style: dashed;
      }
      .seg {
        display: inline-flex;
        padding: 4px;
        background: var(--surface-2);
        border-radius: var(--r-pill);
        gap: 4px;
        flex-wrap: wrap;
      }
      .seg button {
        min-height: 38px;
        padding: 0 16px;
        border-radius: var(--r-pill);
        font-size: 13.5px;
        font-weight: 500;
        color: var(--ink-2);
      }
      .seg button[aria-pressed="true"] {
        background: var(--surface);
        color: var(--ink);
        box-shadow: var(--sh-1);
      }
      .swatches {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }
      .swatches button {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        padding: 4px;
        border: 2px solid transparent;
        display: grid;
        place-items: center;
      }
      .swatches button i {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        display: block;
        box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.1);
      }
      .swatches button[aria-pressed="true"] {
        border-color: var(--ink);
      }
      .buy-row {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .buy-row .btn {
        flex: 1;
        min-width: 0;
        padding: 0 16px;
      }
      .buy-row .wishbig {
        width: 52px;
        height: 52px;
        border: 1.5px solid var(--line-2);
        flex: none;
      }
      .wa-link {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 48px;
        border-radius: var(--r-pill);
        border: 1.5px solid var(--line);
        color: var(--wa);
        font-weight: 500;
        font-size: 14.5px;
        background: var(--surface);
      }
      .wa-link:hover {
        border-color: var(--wa);
      }
      .assure {
        display: flex;
        flex-direction: column;
        border: 1px solid var(--line);
        border-radius: var(--r-md);
        background: var(--surface);
      }
      .assure > div {
        display: flex;
        gap: 12px;
        padding: 14px 16px;
        align-items: flex-start;
        font-size: 13.5px;
      }
      .assure > div + div {
        border-top: 1px solid var(--line);
      }
      .assure b {
        display: block;
        font-weight: 600;
        font-size: 14px;
      }
      .assure span {
        color: var(--ink-3);
      }
      .cmp-toggle {
        display: flex;
        gap: 12px;
        align-items: center;
        font-size: 14px;
      }
      .warn {
        display: flex;
        gap: 12px;
        padding: 14px 16px;
        border-radius: var(--r-md);
        background: var(--surface-2);
        font-size: 13px;
        color: var(--ink-2);
      }
      .warn b {
        color: var(--ink);
        font-weight: 600;
      }
      .pdp-more {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 36px;
        padding-block: 24px 8px;
        border-top: 1px solid var(--line);
      }
      @container app (min-width:900px) {
        .pdp-more {
          grid-template-columns: 1fr 1fr;
          gap: 56px;
        }
      }
      .specs {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }
      .specs th,
      .specs td {
        text-align: left;
        padding: 12px 0;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
      }
      .specs th {
        color: var(--ink-3);
        font-weight: 400;
        width: 45%;
      }
      .specs td {
        font-family: var(--mono);
        font-size: 13.5px;
      }
      .desc {
        display: flex;
        flex-direction: column;
        gap: 12px;
        color: var(--ink-2);
        max-width: 62ch;
      }
      .rv-sum {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 20px;
        align-items: center;
        padding: 20px;
        background: var(--surface);
        border-radius: var(--r-md);
        border: 1px solid var(--line);
      }
      .rv-avg {
        font-size: 44px;
        font-weight: 600;
        letter-spacing: -0.04em;
        line-height: 1;
      }
      .rv-bars {
        display: flex;
        flex-direction: column;
        gap: 5px;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }
      .rv-bars div {
        display: grid;
        grid-template-columns: 14px 1fr 28px;
        gap: 8px;
        align-items: center;
      }
      .rv-bars s {
        display: block;
        height: 6px;
        border-radius: 3px;
        background: var(--surface-2);
        position: relative;
        overflow: hidden;
        text-decoration: none;
      }
      .rv-bars s i {
        position: absolute;
        inset: 0 auto 0 0;
        background: var(--ink);
        border-radius: 3px;
      }
      .rv {
        padding: 18px 0;
        border-bottom: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .rv-h {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        font-size: 13px;
        color: var(--ink-3);
        flex-wrap: wrap;
      }
      .rv b {
        font-weight: 600;
        font-size: 14.5px;
        color: var(--ink);
      }

      /* cart */
      .line {
        display: grid;
        grid-template-columns: 76px 1fr;
        gap: 14px;
        padding: 16px 0;
        border-bottom: 1px solid var(--line);
      }
      .line .th {
        width: 76px;
        height: 92px;
        border-radius: 12px;
        overflow: hidden;
        display: block;
      }
      .line .th svg {
        width: 100%;
        height: 100%;
      }
      .line .t {
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 0;
      }
      .line .t a {
        font-weight: 500;
        text-decoration: none;
        font-size: 14.5px;
        line-height: 1.3;
      }
      .line .t a:hover {
        text-decoration: underline;
      }
      .line .v {
        font-size: 12.5px;
        color: var(--ink-3);
      }
      .line .r {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        margin-top: 6px;
        flex-wrap: wrap;
      }
      .line .rm {
        font-size: 12.5px;
        color: var(--ink-3);
        display: inline-flex;
        align-items: center;
        gap: 4px;
        min-height: 32px;
        padding: 0 6px;
        border-radius: 6px;
      }
      .line .rm:hover {
        color: var(--error);
        background: var(--error-soft);
      }
      .wa-card {
        display: flex;
        align-items: center;
        gap: 14px;
        width: 100%;
        padding: 14px 14px 14px 16px;
        border-radius: var(--r-md);
        background: var(--mint-soft);
        border: 1px solid transparent;
        text-align: left;
        color: var(--ink);
        transition:
          border-color 0.2s var(--ease),
          transform 0.15s var(--ease);
      }
      .wa-card:hover {
        border-color: var(--wa);
      }
      .wa-card:active {
        transform: scale(0.99);
      }
      .wa-card .wa-ic {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background: var(--wa);
        color: #fff;
        display: grid;
        place-items: center;
        flex: none;
      }
      .wa-card .t {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
        line-height: 1.3;
      }
      .wa-card .t b {
        font-weight: 600;
        font-size: 14.5px;
      }
      .wa-card .t span {
        font-size: 13px;
        color: var(--ink-2);
      }
      .wa-card > .i {
        color: var(--ink-3);
      }
      .fdel {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 14px 16px;
        border-radius: var(--r-md);
        background: var(--surface-2);
        font-size: 13.5px;
      }
      .fdel .bar {
        height: 6px;
        border-radius: 3px;
        background: var(--line);
        overflow: hidden;
      }
      .fdel .bar i {
        display: block;
        height: 100%;
        background: var(--success);
        border-radius: 3px;
        transition: width 0.4s var(--ease);
      }
      .totals {
        display: flex;
        flex-direction: column;
        gap: 10px;
        font-size: 14.5px;
      }
      .totals > div {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        font-variant-numeric: tabular-nums;
      }
      .totals .grand {
        font-size: 18px;
        font-weight: 600;
        padding-top: 12px;
        border-top: 1px solid var(--line);
      }
      .totals .disc {
        color: var(--success);
      }
      .promo-f {
        display: flex;
        gap: 8px;
      }
      .promo-f .input {
        min-height: 46px;
        text-transform: uppercase;
        font-family: var(--mono);
        font-size: 15px;
      }
      .promo-ok {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        border-radius: var(--r-sm);
        background: var(--success-soft);
        color: var(--success);
        font-size: 13.5px;
        font-weight: 500;
      }
      .promo-ok button {
        color: var(--ink-2);
        font-size: 13px;
        text-decoration: underline;
      }
      .cart-page {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 28px;
        padding-bottom: 48px;
      }
      @container app (min-width:900px) {
        .cart-page {
          grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr);
          gap: 48px;
          align-items: start;
        }
      }
      .panel {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--r-lg);
        padding: 22px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      @container app (min-width:900px) {
        .panel.sticky {
          position: sticky;
          top: 126px;
        }
        .co .panel.sticky {
          top: 90px;
        }
      }

      /* checkout */
      .co-hdr {
        background: var(--surface);
        border-bottom: 1px solid var(--line);
        position: sticky;
        top: 0;
        z-index: 10;
      }
      .co-hdr .hdr-in {
        justify-content: space-between;
      }
      .secure {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        color: var(--ink-2);
      }
      .co {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 20px;
        padding-block: 20px 56px;
      }
      @container app (min-width:900px) {
        .co {
          grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr);
          gap: 40px;
          align-items: start;
          padding-block: 32px 64px;
        }
      }
      .co-sum-m {
        display: block;
      }
      @container app (min-width:900px) {
        .co-sum-m {
          display: none;
        }
      }
      .co-sum-d {
        display: none;
      }
      @container app (min-width:900px) {
        .co-sum-d {
          display: flex;
        }
      }
      .co-step {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--r-lg);
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      @container app (min-width:720px) {
        .co-step {
          padding: 26px;
        }
      }
      .co-step h2 {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 17px;
        font-weight: 600;
        margin: 0;
        letter-spacing: -0.01em;
      }
      .co-step h2 .n {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: var(--ink);
        color: #fff;
        font-size: 13px;
        display: grid;
        place-items: center;
        font-family: var(--mono);
      }
      .grid2 {
        display: grid;
        gap: 14px;
      }
      @container app (min-width:560px) {
        .grid2 {
          grid-template-columns: 1fr 1fr;
        }
      }
      .atype {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }
      .atype button {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-height: 72px;
        padding: 10px 6px;
        border: 1.5px solid var(--line);
        border-radius: var(--r-md);
        background: var(--surface);
        font-size: 13.5px;
        font-weight: 500;
        color: var(--ink-2);
        text-align: center;
        line-height: 1.25;
        transition:
          border-color 0.2s var(--ease),
          background-color 0.2s var(--ease),
          color 0.2s var(--ease),
          transform 0.15s var(--ease);
      }
      .atype button:hover {
        border-color: var(--ink-3);
      }
      .atype button:active {
        transform: scale(0.97);
      }
      .atype button[aria-pressed="true"] {
        border-color: var(--ink);
        background: var(--bg);
        color: var(--ink);
        box-shadow: inset 0 0 0 1px var(--ink);
      }
      @container app (min-width:560px) {
        .atype button {
          flex-direction: row;
          min-height: 52px;
          gap: 8px;
        }
      }
      .pay-opt {
        display: flex;
        gap: 14px;
        align-items: flex-start;
        padding: 16px;
        border: 1.5px solid var(--ink);
        border-radius: var(--r-md);
        background: var(--bg);
      }
      .pay-opt.off {
        border-color: var(--line);
        border-style: dashed;
        background: var(--surface);
        color: var(--ink-3);
      }
      .errsum {
        padding: 14px 16px;
        border-radius: var(--r-md);
        background: var(--error-soft);
        color: var(--error);
        font-size: 14px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .errsum:focus {
        outline: 3px solid var(--error);
      }
      .errsum ul {
        margin: 0;
        padding-left: 18px;
      }
      .errsum a {
        color: var(--error);
      }
      .sumdet {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--r-lg);
      }
      .sumdet summary {
        list-style: none;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 18px;
        cursor: pointer;
        font-weight: 500;
      }
      .sumdet summary::-webkit-details-marker {
        display: none;
      }
      .sumdet[open] summary .i {
        transform: rotate(180deg);
      }
      .sumdet .in {
        padding: 0 18px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .mini-line {
        display: grid;
        grid-template-columns: 52px 1fr auto;
        gap: 12px;
        align-items: center;
        font-size: 13.5px;
      }
      .mini-line .th {
        width: 52px;
        height: 60px;
        border-radius: 10px;
        overflow: hidden;
        position: relative;
      }
      .mini-line .th svg {
        width: 100%;
        height: 100%;
      }
      .mini-line .q {
        position: absolute;
        top: 3px;
        right: 3px;
        background: var(--ink);
        color: #fff;
        font-size: 10.5px;
        border-radius: 8px;
        min-width: 18px;
        height: 18px;
        display: grid;
        place-items: center;
        font-weight: 600;
      }
      .mini-line .v {
        color: var(--ink-3);
        font-size: 12px;
      }

      /* confirmation */
      .done {
        max-width: 680px;
        margin-inline: auto;
        padding-block: 40px 64px;
        display: flex;
        flex-direction: column;
        gap: 24px;
      }
      .done-ic {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        background: var(--success);
        color: #fff;
        display: grid;
        place-items: center;
        animation: pop 0.5s var(--ease);
      }
      @keyframes pop {
        0% {
          transform: scale(0.6);
        }
        60% {
          transform: scale(1.08);
        }
        100% {
          transform: scale(1);
        }
      }
      .steps {
        display: flex;
        flex-direction: column;
        gap: 0;
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .steps li {
        display: grid;
        grid-template-columns: 28px 1fr;
        gap: 14px;
        padding-bottom: 18px;
        position: relative;
      }
      .steps li::before {
        content: "";
        position: absolute;
        left: 13px;
        top: 28px;
        bottom: 0;
        width: 2px;
        background: var(--line);
      }
      .steps li:last-child::before {
        display: none;
      }
      .steps .dot {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 2px solid var(--line-2);
        background: var(--surface);
        display: grid;
        place-items: center;
      }
      .steps .dot.on {
        background: var(--success);
        border-color: var(--success);
        color: #fff;
      }
      .steps b {
        display: block;
        font-weight: 600;
        font-size: 14.5px;
      }
      .steps span {
        font-size: 13.5px;
        color: var(--ink-3);
      }
      .cashbox {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 18px 20px;
        border-radius: var(--r-md);
        background: var(--ink);
        color: #fff;
        flex-wrap: wrap;
      }
      .cashbox b {
        font-size: 24px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }

      /* compare */
      .cmp-wrap {
        overflow-x: auto;
        border: 1px solid var(--line);
        border-radius: var(--r-lg);
        background: var(--surface);
      }
      .cmp {
        border-collapse: collapse;
        width: 100%;
        min-width: 560px;
        font-size: 14px;
      }
      .cmp th,
      .cmp td {
        padding: 14px 16px;
        border-bottom: 1px solid var(--line);
        text-align: left;
        vertical-align: top;
      }
      .cmp th {
        color: var(--ink-3);
        font-weight: 400;
        width: 150px;
        position: sticky;
        left: 0;
        background: var(--surface);
      }
      .cmp td {
        font-family: var(--mono);
        font-size: 13.5px;
      }
      .cmp td.best {
        background: var(--success-soft);
      }
      .cmp .ch {
        display: flex;
        flex-direction: column;
        gap: 8px;
        font-family: var(--font);
      }
      .cmp .ch .th {
        width: 100%;
        max-width: 150px;
        aspect-ratio: 1;
        border-radius: 12px;
        overflow: hidden;
      }
      .cmp .ch .th svg {
        width: 100%;
        height: 100%;
      }

      /* help */
      .tabs {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding-bottom: 6px;
        scrollbar-width: none;
        margin-bottom: 24px;
      }
      .tabs::-webkit-scrollbar {
        display: none;
      }
      .prose {
        display: flex;
        flex-direction: column;
        gap: 14px;
        max-width: 68ch;
        color: var(--ink-2);
        padding-bottom: 48px;
      }
      .prose h2 {
        color: var(--ink);
      }
      .prose h3 {
        color: var(--ink);
        font-size: 16px;
        font-weight: 600;
        margin: 10px 0 0;
      }
      .prose ul {
        margin: 0;
        padding-left: 20px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .note {
        display: flex;
        gap: 10px;
        padding: 12px 14px;
        border-radius: var(--r-sm);
        background: var(--saffron-soft);
        color: var(--warning);
        font-size: 13px;
        border: 1px dashed var(--ph-line);
      }
      .note .i {
        width: 18px;
        height: 18px;
        flex: none;
        margin-top: 1px;
      }

      /* toast */
      .toast {
        display: flex;
        align-items: center;
        gap: 12px;
        background: var(--ink);
        color: #fff;
        border-radius: var(--r-md);
        padding: 10px 10px 10px 14px;
        font-size: 14px;
        box-shadow: var(--sh-3);
        max-width: min(440px, 100%);
        animation: toastIn 0.35s var(--ease);
      }
      .toast .th {
        width: 40px;
        height: 44px;
        border-radius: 8px;
        overflow: hidden;
        flex: none;
      }
      .toast .th svg {
        width: 100%;
        height: 100%;
      }
      .toast .t {
        flex: 1;
        min-width: 0;
        line-height: 1.35;
      }
      .toast .t > span {
        display: block;
        color: #aeb6bf;
        font-size: 12.5px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .toast button {
        color: var(--saffron);
        font-weight: 500;
        padding: 8px 10px;
        border-radius: 8px;
        white-space: nowrap;
      }
      .toast button:hover {
        background: rgba(255, 255, 255, 0.1);
      }
      .toast.out {
        animation: toastOut 0.25s var(--ease) forwards;
      }
      @keyframes toastIn {
        from {
          opacity: 0;
          transform: translateY(12px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes toastOut {
        to {
          opacity: 0;
          transform: translateY(8px);
        }
      }
      @container app (min-width:720px) {
        #toasts {
          padding-bottom: 24px;
        }
      }

      .view-in {
        animation: viewIn 0.32s ease-out;
      }
      @keyframes viewIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      /* ---------- brief (presenter document) ---------- */
      .brief {
        position: fixed;
        inset: 0;
        top: var(--bar-h);
        background: #f7f8f9;
        color: var(--ink);
        overflow-y: auto;
        z-index: 70;
        animation: enter 0.35s var(--ease);
      }
      .brief-in {
        max-width: 960px;
        margin-inline: auto;
        padding: 32px 20px 96px;
      }
      .brief-nav {
        position: sticky;
        top: 0;
        z-index: 2;
        background: rgba(247, 248, 249, 0.95);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid var(--line);
      }
      .brief-nav .in {
        max-width: 960px;
        margin-inline: auto;
        padding: 10px 20px;
        display: flex;
        gap: 6px;
        overflow-x: auto;
        align-items: center;
        scrollbar-width: none;
      }
      .brief-nav a {
        font-size: 13px;
        padding: 6px 10px;
        border-radius: 8px;
        text-decoration: none;
        color: var(--ink-2);
        white-space: nowrap;
      }
      .brief-nav a:hover {
        background: var(--surface-2);
        color: var(--ink);
      }
      .brief h1 {
        font-size: clamp(30px, 5vw, 44px);
        letter-spacing: -0.035em;
        line-height: 1.08;
        margin: 8px 0 12px;
        font-weight: 600;
        text-wrap: balance;
      }
      .brief h2 {
        font-size: 24px;
        letter-spacing: -0.025em;
        margin: 0 0 6px;
        font-weight: 600;
      }
      .brief .phase {
        padding-top: 56px;
        scroll-margin-top: 56px;
      }
      .brief .phase > .eyebrow {
        display: block;
        margin-bottom: 8px;
      }
      .brief .kicker {
        color: var(--ink-2);
        max-width: 66ch;
        margin-bottom: 22px;
      }
      .brief h3 {
        font-size: 16px;
        margin: 22px 0 8px;
        font-weight: 600;
      }
      .brief p,
      .brief li {
        color: var(--ink-2);
        font-size: 14.5px;
      }
      .brief ul {
        padding-left: 20px;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .find {
        display: grid;
        gap: 12px;
      }
      @media (min-width: 760px) {
        .find {
          grid-template-columns: 1fr 1fr;
        }
      }
      .find > div {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--r-md);
        padding: 18px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .find h4 {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
      }
      .find .so {
        font-size: 12.5px;
        color: var(--ink-3);
      }
      .find .so a {
        color: var(--ink-2);
      }
      .find .imp {
        font-size: 13.5px;
        color: var(--ink);
        padding-top: 8px;
        border-top: 1px solid var(--line);
        margin-top: auto;
      }
      .find .imp b {
        font-weight: 600;
      }
      .tbl-wrap {
        overflow-x: auto;
        border: 1px solid var(--line);
        border-radius: var(--r-md);
        background: var(--surface);
      }
      .tbl {
        border-collapse: collapse;
        width: 100%;
        min-width: 620px;
        font-size: 13.5px;
      }
      .tbl th,
      .tbl td {
        padding: 11px 14px;
        border-bottom: 1px solid var(--line);
        text-align: left;
        vertical-align: top;
      }
      .tbl th {
        font-size: 11.5px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--ink-3);
        font-weight: 600;
        background: var(--bg);
      }
      .tbl tr:last-child td {
        border-bottom: 0;
      }
      .tier {
        display: inline-flex;
        height: 22px;
        align-items: center;
        padding: 0 8px;
        border-radius: 11px;
        font-size: 11.5px;
        font-weight: 600;
        white-space: nowrap;
      }
      .tier.e {
        background: var(--ink);
        color: #fff;
      }
      .tier.r {
        background: var(--lagoon-soft);
        color: #14566d;
      }
      .tier.p {
        background: var(--surface-2);
        color: var(--ink-2);
      }
      .sitemap {
        display: grid;
        gap: 12px;
      }
      @media (min-width: 760px) {
        .sitemap {
          grid-template-columns: repeat(3, 1fr);
        }
      }
      .sm-col {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--r-md);
        padding: 16px;
      }
      .sm-col h4 {
        margin: 0 0 10px;
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--ink-3);
      }
      .sm-col ul {
        list-style: none;
        padding: 0;
        gap: 4px;
      }
      .sm-col li {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        font-size: 13.5px;
        color: var(--ink);
        padding: 5px 0;
        border-bottom: 1px dashed var(--line);
      }
      .sm-col li code {
        font-family: var(--mono);
        font-size: 11.5px;
        color: var(--ink-3);
      }
      .sm-col li.p2 {
        color: var(--ink-3);
      }
      .flow {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        font-size: 13px;
        margin: 8px 0;
      }
      .flow span {
        padding: 7px 12px;
        border-radius: var(--r-pill);
        background: var(--surface);

            if (state.compare.length >= 3) {

                title: "Compare holds up to 3 kits",

        function addRecent(id) {

        /* search + filters */
        function search(q) {
          q = q.trim().toLowerCase();
          if (!q) return [];
          const terms = q.split(/\s+/);
          return P.map((p) => {
            const hay = [
              p.name,
              brandName(p.b),
              B[p.b].tag,
              p.type === "kit"
                ? "kit kits pod device devices " + p.cols.join(" ")
                : "disposable disposables " + p.fl.map((f) => f.n).join(" "),
              p.puffs
                ? p.puffs + " puffs " + Math.round(p.puffs / 1000) + "k"
                : "",
            ]
              .join(" ")
              .toLowerCase();
            let s = 0;
            for (const t of terms) {
              if (!hay.includes(t)) return null;
              s += p.name.toLowerCase().includes(t)
                ? 3
                : brandName(p.b).toLowerCase().includes(t)
                  ? 2
                  : 1;
            }
            return { p, s };
          })
            .filter(Boolean)
            .sort((a, b) => b.s - a.s || a.p.rank - b.p.rank)
            .map((x) => x.p);
        }
        const PRICE = {
          u50: [0, 50, "Under AED 50"],
          "50-100": [50, 100, "AED 50–100"],
          "100-200": [100, 200, "AED 100–200"],
          o200: [200, 1e9, "AED 200+"],
        };
        const PUFF = {
          u6: [0, 6000, "Up to 6,000"],
          "6-12": [6000, 12000, "6,000–12,000"],
          o12: [12001, 1e9, "12,000+"],
        };
        const inR = (n, [a, b]) => n >= a && n <= b;
        function match(p, f, skip) {
          return (
            (skip === "cats" || !f.cats.length || f.cats.includes(p.type)) &&
            (skip === "brands" || !f.brands.length || f.brands.includes(p.b)) &&
            (skip === "price" || !f.price || inR(p.price, PRICE[f.price])) &&
            (skip === "puffs" ||
              !f.puffs ||
              (p.type === "disposable" && inR(p.puffs, PUFF[f.puffs]))) &&
            (skip === "nic" ||
              !f.nic.length ||
              (p.type === "disposable" &&
                p.nic.some((n) => f.nic.includes(n)))) &&
            (skip === "inStock" || !f.inStock || !p.oos) &&
            (skip === "sale" || !f.sale || !!p.was)
          );
        }
        function baseList() {
          return state.f.q ? search(state.f.q) : P.slice();
        }
        function results() {
          const list = baseList().filter((p) => match(p, state.f));
          const s = state.sort,
            oosLast = (a, b) => a.oos - b.oos;
          const by = {
            featured: (a, b) => oosLast(a, b) || a.order - b.order,
            best: (a, b) => oosLast(a, b) || a.rank - b.rank,
            "price-asc": (a, b) => a.price - b.price,
            "price-desc": (a, b) => b.price - a.price,
            new: (a, b) => b.isNew - a.isNew || b.order - a.order,
          };
          if (!(state.f.q && s === "featured")) list.sort(by[s]);
          return list;
        }
        function facetCount(key, val) {
          const f = { ...state.f };
          if (key === "cats") f.cats = [val];
          else if (key === "brands") f.brands = [val];
          else if (key === "price") f.price = val;
          else if (key === "puffs") f.puffs = val;
          else if (key === "nic") f.nic = [val];
          return baseList().filter((p) => match(p, f, null)).length;
        }
        function activeCount() {
          const f = state.f;
          return (
            f.cats.length +
            f.brands.length +

        /* ================= navigation ================= */

        function jump(y) {

        function nav(name, p = {}, opts = {}) {
          if (state.age !== "yes" && !["gate", "restricted"].includes(name))

          if (name === "shop") {
            const f = blankF();
            if (p.cat) f.cats = [p.cat];
            if (p.brand) f.brands = [p.brand];
            if (p.sale) f.sale = true;
            if (p.q) f.q = p.q;
            if (p.puffs) {
              f.cats = ["disposable"];
              f.puffs = p.puffs;
            }
            state.f = f;
            if (!opts.keepSort) state.sort = p.q ? "featured" : "featured";
            loadFlash();
          }
          if (name === "pdp") {
            const pr = byId[p.id];
            state.pdp = { id: p.id, ...variantOf(pr, {}), qty: 1, img: 0 };
            addRecent(p.id);
          }
          if (name !== "checkout") state.coErr = null;

              h.setAttribute("tabindex", "-1");
              h.focus({ preventScroll: true });
            }

          if (!$("#sheet-host").hidden && $(".sheet.pop")) {
            closeSheet();
            swap(go);

            go();

            const h = $("#main h1");
            setTimeout(
              () =>

        function afterRender() {
          const sc = $("#scroller");
          setupHero();
          if ("IntersectionObserver" in window && !reduced()) {
            if (window.__rv) window.__rv.disconnect();
            const lim = sc.getBoundingClientRect().bottom;
            window.__rv = new IntersectionObserver(
              (es) =>
                es.forEach((en) => {
                  if (en.isIntersecting) {
                    const el = en.target;
                    el.classList.add("rv-in");
                    el.classList.remove("rv");
                    window.__rv.unobserve(el);
                    setTimeout(() => el.classList.remove("rv-in"), 650);
                  }
                }),
              { root: sc, rootMargin: "0px 0px -8% 0px" },
            );
            $$("#main .sec, #main .pdp-more, .foot").forEach((el) => {
              if (el.getBoundingClientRect().top > lim) {
                el.classList.add("rv");
                window.__rv.observe(el);
              }
            });
          }
          if (state.route.name === "pdp") {
            const btn = $("#main-add");
            if (btn && "IntersectionObserver" in window) {
              if (window.__io) window.__io.disconnect();
              window.__io = new IntersectionObserver(
                ([en]) => {
                  const show =
                    !en.isIntersecting &&
                    en.boundingClientRect.top <
                      sc.getBoundingClientRect().top + 80;
                  if (show !== state.ui.atcShow) {
                    state.ui.atcShow = show;
                    const el = $(".satc");
                    if (el) {
                      el.classList.toggle("show", show);
                      el.setAttribute("aria-hidden", String(!show));
                      $$("button", el).forEach((b) =>
                        show
                          ? b.removeAttribute("tabindex")
                          : b.setAttribute("tabindex", "-1"),
                      );
                    }
                  }
                },
                { root: sc, threshold: 0 },
              );
              window.__io.observe(btn);
            }
            const g = $("#gal");
            if (g) {
              g.addEventListener(
                "scroll",
                () => {
                  const i = Math.round(g.scrollLeft / g.clientWidth);
                  if (i !== state.pdp.img) {
                    state.pdp.img = i;
                    $$(".gal-dots i").forEach((d, j) =>
                      d.classList.toggle("on", j === i),
                    );
                    $$(".gal-thumbs button").forEach((d, j) =>
                      d.setAttribute("aria-current", String(j === i)),
                    );
                  }
                },
                { passive: true },
              );
            }
          } else state.ui.atcShow = false;
        }
