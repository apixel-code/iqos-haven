   <h1>A calm, colourful Dubai vape store that puts the age check first.</h1>
   <p class="kicker">Prepared for client review. Everything in the prototype is fictional demo data: brands, products, prices, ratings and delivery terms. Copy that needs the client's confirmation has a dashed underline (toggle “Placeholders” in the top bar).</p>
   <div class="cta-row"><button class="btn btn-primary" data-b="demo">Start the demo at the age gate</button><button class="btn btn-outline" data-b="dev" data-v="phone">${ico("phone", "sm")} Present in mobile frame</button></div>

   <section class="phase" id="p1"><span class="eyebrow">Phase 1</span><h2>Research summary</h2><p class="kicker">Focused desk research on UAE rules, Dubai shopping behaviour and six Dubai vape retailers. Findings shaped specific design decisions, noted under each.</p>
    <div class="find">
     <div><h4>Adult-only, licensed category</h4><p>E-cigarette sales have been legal in the UAE since 2019 with a minimum age of 18. Retailers are expected to verify age, and online sales are allowed for licensed sellers of MoIAT-certified products.</p><p class="so">${src("GSTHR", "https://gsthr.org/countries/profile/are/2/")} · ${src("Podsalt", "https://www.podsalt.store/blog/post/are-electronic-cigarettes-legal-in-the-uae")} · ${src("ELFBAR UAE", "https://elfbar.ae/blogs/news/vape-legal-uae-guide")}</p><p class="imp"><b>Decision:</b> age gate before any store content, an 18+ confirmation at checkout, and slots for licence number and warnings. Not a compliance guarantee; wording goes to the client's legal review.</p></div>
     <div><h4>Shopping happens on phones</h4><p>Around 79% of UAE e-commerce transactions are made on smartphones, and over 80% of traffic comes from mobile.</p><p class="so">${src("Andava, UAE digital marketing statistics 2026", "https://www.andava.com/learn/uae-digital-marketing-statistics/")}</p><p class="imp"><b>Decision:</b> designed at 390px first. Bottom navigation, thumb-zone actions, sticky add-to-cart, filter sheet, full-screen search.</p></div>
     <div><h4>Cash on delivery is shrinking but expected here</h4><p>COD preference in MENA halved from 41% to 20% (2020–2023), but 71.2% of UAE retailers still offer it, and it stays relevant for first-time buyers. All six vape stores reviewed lead with COD.</p><p class="so">${src("Checkout.com MENA report", "https://www.checkout.com/newsroom/checkout-coms-4th-annual-mena-report-finds-cash-on-delivery-usage-halved-amongst-maturing-digital-economy")} · ${src("ADAT UAE e-commerce statistics", "https://www.adat.ae/guides/uae-ecommerce-statistics")}</p><p class="imp"><b>Decision:</b> COD-only MVP with a one-page checkout. Online payment shown as “phase 2”, subject to provider approval.</p></div>
     <div><h4>WhatsApp is the default channel</h4><p>WhatsApp reaches about 90% of UAE users and is the most-used social channel. Shoppers often discover on social, check on Google and close on WhatsApp.</p><p class="so">${src("Infobip WhatsApp statistics", "https://www.infobip.com/blog/whatsapp-statistics")} · ${src("Panamedia", "https://panamedia.me/whatsapp-marketing-uae-businesses-guide/")}</p><p class="imp"><b>Decision:</b> WhatsApp as the secondary path everywhere, with context-aware prefilled messages (product, cart, order, failed search). The floating button hides on checkout and on mobile product pages, where the sticky bar carries it.</p></div>
     <div><h4>Dubai addresses have no postcode</h4><p>Couriers rely on area, building or villa, unit number and a mobile number. Makani, a 10-digit building-entrance number, improves accuracy.</p><p class="so">${src("Jeebly", "https://jeebly.com/blogs/dubai-address-format/")} · ${src("Property Finder", "https://www.propertyfinder.ae/blog/makani-dubai-dubai-municipalitys-new-navigation-app/")}</p><p class="imp"><b>Decision:</b> no postcode field. Address type switch (apartment, villa, office) changes the fields; area picker; optional Makani and landmark.</p></div>
     <div><h4>Competitor patterns</h4><p>Reviewed: Vape City Dubai, Vape King DXB, Dubai Vape Gallery, Smok Dubai, Vape Lion, My Vapery. Common: same-day and cut-off banners, COD badges, brand-led menus, puff count in product names, dense discount copy, dark templates, each flavour listed as a separate product.</p><p class="so">${src("vapcity.ae", "https://vapcity.ae/")} · ${src("vkdxb.com", "https://vkdxb.com/")} · ${src("smokdubai.com", "https://smokdubai.com/")}</p><p class="imp"><b>Decision:</b> keep the expected trust signals, drop the clutter. Light neutral base, one promo ticker and one campaign slot, flavours grouped as variants of one product.</p></div>
    </div>
    <h3>Age-restricted access patterns we follow</h3>
    <ul><li>A full-screen interstitial, not a dismissable popup over visible products.</li><li>Two explicit, equally sized answers. Nothing pre-selected; focus lands on the question, not on “Yes”.</li><li>No product imagery, prices or offers on the gate or on the restricted screen.</li><li>“No” leads to a respectful dead end with an exit link and no route back into the store.</li><li>The answer is remembered for a defined period on the device, so verified adults aren't asked on every page.</li></ul>
    <div class="callout" style="margin-top:20px"><b>Recommended direction: “gallery calm, flavour colour”.</b><p>A cool neutral canvas with ink-black actions. Colour comes from the catalogue itself: each flavour and finish has its own colour field, so the grid looks vivid without loud gradients or neon. Saffron, coral and lagoon are reserved for offers, sale prices and categories.</p></div>
   </section>

   <section class="phase" id="p2"><span class="eyebrow">Phase 2</span><h2>Information architecture</h2><p class="kicker">The catalogue is about 50 SKUs. Grouping flavours and colours as variants turns that into roughly 24 products, which keeps the grid scannable and makes filters meaningful.</p>

   <section class="phase" id="p3"><span class="eyebrow">Phase 3</span><h2>Design system</h2><p class="kicker">Tokens map one-to-one to a Tailwind theme. Components are the same ones running in the prototype.</p>

   <section class="phase" id="p7"><span class="eyebrow">Phase 7</span><h2>Client presentation summary</h2>
    <div class="find">
     <div><h4>Design concept</h4><p>“Gallery calm, flavour colour.” A clean neutral store where products bring the colour. Premium through restraint: generous space, one typeface family, ink actions, few but deliberate accents.</p></div>
     <div><h4>Age-verification strategy</h4><p>The gate is the first branded screen, not a popup. Nothing from the store is rendered until the visitor confirms. Under-18 visitors reach a dead end. In production the check runs server-side before any page renders, and a second confirmation sits in checkout.</p></div>
     <div><h4>Key UX decisions</h4><p>Flavours as variants, not separate products. Puff count as a first-class filter and home shortcut. Compare only for kits. Recently viewed kept out of product pages. One campaign slot plus one ticker for promotions.</p></div>
     <div><h4>Mobile strategy</h4><p>Bottom navigation, full-screen search, filter sheet with live result count, swipe gallery, sticky add-to-cart with WhatsApp, collapsible order summary at checkout, 44px+ touch targets.</p></div>
     <div><h4>Conversion strategy</h4><p>Short paths: quick add, cart drawer, single-page COD checkout with only courier-required fields. Free-delivery progress, clear promo codes, trust lines near the buy button. WhatsApp catches undecided customers with a prefilled message.</p></div>
     <div><h4>In this prototype</h4><p>Age gate (both paths), home, category, brand, offers, search, product, quick add, wishlist, compare, cart drawer and page, checkout with validation, confirmation, help pages, design system and wireframe view.</p></div>
    </div>

     <div><h4>Age gate in production</h4><ul><li>Next.js middleware checks an <code class="mono">ih_age</code> cookie on every store route and redirects to the gate before any HTML is sent.</li><li>Cookie lifetime set from admin (proposed 30 days, pending compliance advice).</li><li>Gate text, warnings and duration editable centrally, so a stronger method (e.g. ID check on delivery or UAE Pass) can be added later without redesign.</li></ul></div>
     <div><h4>Back end · Node.js API</h4><ul><li>Products with variants and per-variant stock, brands, categories, orders, promo codes, banners, settings.</li><li>Order notifications to the shop's WhatsApp Business number and email.</li></ul></div>
