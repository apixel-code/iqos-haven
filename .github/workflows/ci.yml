name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_DB: iqos_haven_test
          POSTGRES_USER: ih_test
          POSTGRES_PASSWORD: ih_test_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ih_test -d iqos_haven_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4.9-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
      # Local SMTP sink for email integration tests; nothing leaves the runner.
      mailpit:
        image: axllent/mailpit:v1.31.4@sha256:b68349e3a014b90c5610bfb26b2ae36f3892d7b8cf25ee140c6c71c98d2fcf48
        ports: ["1025:1025", "8025:8025"]
    env:
      APP_ENV: test
      DATABASE_TEST_URL: postgres://ih_test:ih_test_ci@localhost:5432/iqos_haven_test
      QUEUE_REDIS_URL: redis://localhost:6379
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      MAILPIT_URL: http://localhost:8025
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: ih_service
      S3_SECRET_KEY: ih_service_ci_secret
      S3_FORCE_PATH_STYLE: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:boundaries
      - run: pnpm test:infra
      - run: pnpm test:package
      - run: pnpm contracts:check
      # Service containers cannot take arguments, so MinIO starts here; the same init script as
      # local Compose creates private buckets and the least-privilege service user.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=ih_minio -e MINIO_ROOT_PASSWORD=ih_minio_ci_root \
            cgr.dev/chainguard/minio:latest@sha256:59667194421209c2c1eacbe761e24787e047985c5dfa96b15da9b59fe9b55cd0 \
            server /data
          docker run --rm --network host --entrypoint /bin/sh \
            -v "$PWD/infra/minio/init-buckets.sh:/init-buckets.sh:ro" \
            -e MINIO_ENDPOINT=http://localhost:9000 \
            -e MINIO_ROOT_USER=ih_minio -e MINIO_ROOT_PASSWORD=ih_minio_ci_root \
            -e MINIO_SERVICE_USER=ih_service -e MINIO_SERVICE_PASSWORD=ih_service_ci_secret \
            -e MINIO_INIT_RETRIES=60 \
            cgr.dev/chainguard/minio-client:latest-dev@sha256:603a402c2cd1543109c39eb5d1f731bd83b3c8f6ee8299b3785c8519fad0f5b5 \
            /init-buckets.sh
      - run: pnpm test:int
