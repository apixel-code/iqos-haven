# Catch-all for this server (install once as /etc/nginx/sites-available/00-default): requests by
# bare IP or an unknown Host get no site. Port 80 closes the connection (444); on 443 the TLS
# handshake is refused, so no certificate or page of an environment is ever shown by mistake.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    return 444;
}
