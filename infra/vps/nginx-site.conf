# Host nginx template for one environment (steps 122/123, ADR 0100), rendered with
# render-nginx.sh into /etc/nginx/sites-available/iqos-<env>; certbot --nginx then adds TLS and the HTTP→HTTPS
# redirect to each server block. The other sites on this host are not touched.
#
# X-Forwarded-For is OVERWRITTEN with the TCP peer (never appended): the Caddy gateway trusts
# only this hop, so a browser-supplied header can never become the client IP.

# Storefront → Caddy gateway (__PORT_STORE__), which routes /api/v1/store/* and /api/age/* itself.
server {
    listen 80;
    listen [::]:80;
    server_name __HOST_STORE__;
    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:__PORT_STORE__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
    }
}

# Admin → Caddy gateway (__PORT_ADMIN__). Server-sent events must not be buffered.
server {
    listen 80;
    listen [::]:80;
    server_name __HOST_ADMIN__;
    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:__PORT_ADMIN__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}

# Media → MinIO S3 API (__PORT_MEDIA__). Buckets are private: only presigned GETs (images) and the
# presigned POST policy (8 MB uploads into quarantine) succeed. Host must reach MinIO unchanged
# or the presigned signatures do not verify.
server {
    listen 80;
    listen [::]:80;
    server_name __HOST_MEDIA__;
    client_max_body_size 9m;

    location / {
        proxy_pass http://127.0.0.1:__PORT_MEDIA__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_request_buffering off;
    }
}
