# Local development infrastructure only. Never use these credentials outside your machine.
name: iqos-haven

services:
  postgres:
    image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_DB: iqos_haven
      POSTGRES_USER: ih_owner
      POSTGRES_PASSWORD: ih_owner_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg18-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ih_owner -d iqos_haven"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Queue Redis: BullMQ needs noeviction + persistence. Do NOT reuse this for caching.
  redis-queue:
    image: redis:7.4.9-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    command: ["redis-server", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-queue-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    # Upstream MinIO stopped publishing public images; Chainguard rebuilds MinIO from source.
    image: cgr.dev/chainguard/minio:latest@sha256:59667194421209c2c1eacbe761e24787e047985c5dfa96b15da9b59fe9b55cd0
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ih_minio
      MINIO_ROOT_PASSWORD: ih_minio_dev_secret
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data

  # Creates the private buckets once MinIO is up.
  minio-init:
    # -dev variant ships /bin/sh, which init-buckets.sh needs.
    image: cgr.dev/chainguard/minio-client:latest-dev@sha256:603a402c2cd1543109c39eb5d1f731bd83b3c8f6ee8299b3785c8519fad0f5b5
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "/init-buckets.sh"]
    volumes:
      - ./infra/minio/init-buckets.sh:/init-buckets.sh:ro
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ih_minio
      MINIO_ROOT_PASSWORD: ih_minio_dev_secret
      MINIO_INIT_RETRIES: 30
      # Local service identity for api/worker (least privilege; see infra/minio/init-buckets.sh).
      MINIO_SERVICE_USER: ih_service
      MINIO_SERVICE_PASSWORD: ih_service_dev_secret

  mailpit:
    image: axllent/mailpit:v1.31.4@sha256:b68349e3a014b90c5610bfb26b2ae36f3892d7b8cf25ee140c6c71c98d2fcf48
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  # Same-origin gateway (step 29). Storefront http://localhost:8080, admin http://localhost:8081;
  # upstreams are the dev servers on the host. NestJS is reachable only through /api routes.
  gateway:
    image: caddy:2.11-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"
    volumes:
      - ./infra/gateway/Caddyfile:/etc/caddy/Caddyfile:ro
    environment:
      STOREFRONT_UPSTREAM: host.docker.internal:3000
      ADMIN_UPSTREAM: host.docker.internal:3001
      API_UPSTREAM: host.docker.internal:4000
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pg18-data:
  redis-queue-data:
  minio-data:
